<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Floor Market 360 VR Experience</title>
  <!-- A-Frame WebXR Framework -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* Top Overlay Header */
    .header-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), transparent);
      color: #ffffff;
      z-index: 100;
      pointer-events: auto;
    }

    .header-title h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.2px; }
    .header-title p { font-size: 12px; color: rgba(255, 255, 255, 0.75); margin-top: 2px; }

    /* Audio Toggle Button */
    .audio-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .audio-btn:hover { background: #ffffff; color: #111111; }

    /* --- 1. VERTICAL FLOOR SWITCHER (Google Maps Style on Left) --- */
    .floor-elevator-nav {
      position: absolute;
      top: 90px;
      left: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }

    .floor-box-btn {
      width: 42px;
      height: 42px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #333333;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .floor-box-btn:hover {
      background: #ffffff;
      transform: scale(1.05);
    }

    .floor-box-btn.active {
      background: #4285F4;
      color: #ffffff;
      border-color: #1a73e8;
      box-shadow: 0 0 12px rgba(66, 133, 244, 0.7);
    }

    /* --- 2. INTERACTIVE NAVIGATION MINI-MAP (Bottom Left) --- */
    .minimap-container {
      position: absolute;
      bottom: 24px;
      left: 24px;
      width: 170px;
      height: 130px;
      background: rgba(20, 20, 20, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 10px;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      z-index: 100;
      overflow: hidden;
    }

    .minimap-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 3px 8px;
      background: rgba(0, 0, 0, 0.5);
      color: #eee;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .minimap-body {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Architectural layout wireframe for the mini-map */
    .map-blueprint-grid {
      position: absolute;
      inset: 22px 10px 10px 10px;
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }

    /* Radar Hotspot Markers on the Map */
    .map-dot {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #4285F4;
      border: 2px solid #ffffff;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .map-dot:hover {
      transform: translate(-50%, -50%) scale(1.3);
      background: #34A853;
    }

    .map-dot.active {
      background: #EA4335;
      box-shadow: 0 0 10px #EA4335;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(234, 67, 53, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(234, 67, 53, 0); }
      100% { box-shadow: 0 0 0 0 rgba(234, 67, 53, 0); }
    }

    /* Bottom Overlay Navigation (Central Carousel) */
    .bottom-nav-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.4) 70%, transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 90;
      pointer-events: none;
    }

    .bottom-nav-container > * {
      pointer-events: auto;
    }

    .thumbnail-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      max-width: 60vw;
      padding-bottom: 6px;
    }

    .thumb-card {
      position: relative;
      flex: 0 0 auto;
      width: 110px;
      height: 65px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .thumb-card img { width: 100%; height: 100%; object-fit: cover; }

    .thumb-card span {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      font-size: 10px;
      padding: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thumb-card.active {
      border-color: #4285F4;
      box-shadow: 0 0 10px rgba(66, 133, 244, 0.8);
    }
  </style>
</head>
<body>

  <!-- Ambient Audio for Terrace/Market -->
  <audio id="ambient-audio" loop preload="auto" crossorigin="anonymous">
    <source src="https://upload.wikimedia.org/wikipedia/commons/e/ec/Wind_blowing_at_mountain_pass.ogg" type="audio/ogg">
    <source src="https://actions.google.com/sounds/v1/weather/wind_arctic_constant.ogg" type="audio/ogg">
  </audio>

  <!-- Top Header UI -->
  <div class="header-bar">
    <div class="header-title">
      <h1 id="location-title">Central Plaza Entrance</h1>
      <p id="location-subtitle">Ground Floor • Architectural 360 View</p>
    </div>
    <button id="sound-btn" class="audio-btn" onclick="toggleAudio()">
      <span id="sound-icon">🔈</span> <span id="sound-label">Enable Ambience</span>
    </button>
  </div>

  <!-- 1. VERTICAL FLOOR SWITCHER (Google Maps/Street View Style) -->
  <div class="floor-elevator-nav">
    <button class="floor-box-btn" data-floor="3" onclick="switchFloor(3, this)" title="Floor 3">3</button>
    <button class="floor-box-btn" data-floor="2" onclick="switchFloor(2, this)" title="Floor 2">2</button>
    <button class="floor-box-btn" data-floor="1" onclick="switchFloor(1, this)" title="Floor 1">1</button>
    <button class="floor-box-btn active" data-floor="0" onclick="switchFloor(0, this)" title="Ground Floor">G</button>
  </div>

  <!-- 2. NAVIGATION MINI-MAP (Bottom Left) -->
  <div class="minimap-container">
    <div class="minimap-header" id="map-header">Level: Ground</div>
    <div class="minimap-body">
      <div class="map-blueprint-grid"></div>
      <!-- Interactive Dots Placed Dynamically -->
      <div id="minimap-pins"></div>
    </div>
  </div>

  <!-- Bottom Navigation Control Panel -->
  <div class="bottom-nav-container">
    <div class="thumbnail-strip" id="thumb-strip">
      <!-- Generated dynamically -->
    </div>
  </div>

  <!-- A-Frame VR Canvas -->
  <a-scene embedded vr-mode-ui="enabled: true">
    <a-assets>
      <img id="market-hall" src="market.jpg">
    </a-assets>

    <!-- Camera Controller & Reticle for VR -->
    <a-entity id="cameraRig">
      <a-camera id="camera" look-controls>
        <a-cursor 
          id="cursor"
          color="#FFFFFF"
          raycaster="objects: .clickable"
          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1">
        </a-cursor>
      </a-camera>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
    </a-entity>

    <!-- 360 Sky Sphere -->
    <a-sky id="sky-sphere" src="#market-hall" rotation="0 -90 0"></a-sky>

    <!-- Ground Hotspot Navigation (Street View Ring Marker) -->
    <a-entity id="hotspot-navigation" class="clickable" position="0 -1.8 -4" rotation="-90 0 0">
      <a-ring radius-inner="0.3" radius-outer="0.45" color="#FFFFFF" opacity="0.85"></a-ring>
      <a-circle radius="0.3" color="#4285F4" opacity="0.5"></a-circle>
      <a-text value="Walk Forward" align="center" position="0 -0.8 0" rotation="90 0 0" scale="1.2 1.2 1.2" color="#FFFFFF"></a-text>
    </a-entity>
  </a-scene>

  <script>
    // Audio Player Toggle
    const audio = document.getElementById('ambient-audio');
    const soundBtn = document.getElementById('sound-btn');
    const soundLabel = document.getElementById('sound-label');
    const soundIcon = document.getElementById('sound-icon');
    let isPlaying = false;

    function toggleAudio() {
      if (isPlaying) {
        audio.pause();
        soundLabel.innerText = "Enable Ambience";
        soundIcon.innerText = "🔈";
        isPlaying = false;
      } else {
        audio.volume = 0.4;
        audio.play().then(() => {
          soundLabel.innerText = "Mute Ambience";
          soundIcon.innerText = "🔊";
          isPlaying = true;
        }).catch(err => console.warn("Audio waiting for user click:", err));
      }
    }

    document.querySelector('a-scene').addEventListener('enter-vr', () => {
      if (!isPlaying) toggleAudio();
    });

    // Multi-Floor Market Database with Map Coordinates (mapX, mapY in percentage)
    const scenes = [
      // Ground Floor (Level 0)
      { 
        id: 'img-ground-plaza', 
        name: 'Central Plaza Entrance', 
        floorName: 'Ground Floor',
        floorCode: 'G',
        level: 0, 
        src: 'market.jpg', 
        mapX: 35, 
        mapY: 65,
        nextTarget: 'img-ground-arcade', 
        nextLabel: 'Walk to Food Arcade', 
        nextPos: '0 -1.8 -4' 
      },
      { 
        id: 'img-ground-arcade', 
        name: 'Covered Food Arcade', 
        floorName: 'Ground Floor',
        floorCode: 'G',
        level: 0, 
        src: 'market.jpg', 
        mapX: 68, 
        mapY: 45,
        nextTarget: 'img-ground-plaza', 
        nextLabel: 'Return to Main Entrance', 
        nextPos: '0 -1.8 4' 
      },

      // First Floor (Level 1)
      { 
        id: 'img-floor1-atrium', 
        name: 'First Floor Mezzanine', 
        floorName: 'First Floor',
        floorCode: '1',
        level: 1, 
        src: 'market.jpg', 
        mapX: 45, 
        mapY: 55,
        nextTarget: 'img-floor1-shops', 
        nextLabel: 'Walk to Retail Stalls', 
        nextPos: '3 -1.8 -3' 
      },
      { 
        id: 'img-floor1-shops', 
        name: 'Artisan Retail Walk', 
        floorName: 'First Floor',
        floorCode: '1',
        level: 1, 
        src: 'market.jpg', 
        mapX: 75, 
        mapY: 35,
        nextTarget: 'img-floor1-atrium', 
        nextLabel: 'Back to Mezzanine', 
        nextPos: '-3 -1.8 3' 
      },

      // Second Floor (Level 2)
      { 
        id: 'img-floor2-dining', 
        name: 'Level 2 Food Court', 
        floorName: 'Second Floor',
        floorCode: '2',
        level: 2, 
        src: 'market.jpg', 
        mapX: 50, 
        mapY: 50,
        nextTarget: 'img-floor2-dining', 
        nextLabel: 'Central Seating Area', 
        nextPos: '0 -1.8 -4' 
      },

      // Third Floor / Rooftop (Level 3)
      { 
        id: 'img-floor3-terrace', 
        name: 'Rooftop Garden Market', 
        floorName: 'Rooftop Deck (Level 3)',
        floorCode: '3',
        level: 3, 
        src: 'market.jpg', 
        mapX: 50, 
        mapY: 50,
        nextTarget: 'img-floor3-terrace', 
        nextLabel: 'Panoramic Overlook', 
        nextPos: '0 -1.8 -4' 
      }
    ];

    let activeSceneId = 'img-ground-plaza';
    let currentFloor = 0;

    window.onload = () => { 
      updateFloorUI(0);
    };

    function switchFloor(floorNum, btnElement) {
      currentFloor = floorNum;
      
      // Update vertical elevator button active states
      document.querySelectorAll('.floor-box-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) {
        btnElement.classList.add('active');
      } else {
        const matchingBtn = document.querySelector(`.floor-box-btn[data-floor="${floorNum}"]`);
        if (matchingBtn) matchingBtn.classList.add('active');
      }

      // Automatically select the first scene of that floor
      const firstSceneOfFloor = scenes.find(s => s.level === floorNum);
      if (firstSceneOfFloor) {
        loadScene(firstSceneOfFloor.id);
      } else {
        updateFloorUI(floorNum);
      }
    }

    function updateFloorUI(level) {
      // 1. Render Bottom Thumbnails
      const thumbContainer = document.getElementById('thumb-strip');
      thumbContainer.innerHTML = '';
      const filteredScenes = scenes.filter(s => s.level === level);

      filteredScenes.forEach(scene => {
        const card = document.createElement('div');
        card.className = `thumb-card ${scene.id === activeSceneId ? 'active' : ''}`;
        card.onclick = () => loadScene(scene.id);

        card.innerHTML = `
          <img src="${scene.src}" alt="${scene.name}">
          <span>${scene.name}</span>
        `;
        thumbContainer.appendChild(card);
      });

      // 2. Render Mini-map Pins
      const mapContainer = document.getElementById('minimap-pins');
      mapContainer.innerHTML = '';
      document.getElementById('map-header').innerText = `Level: ${filteredScenes[0]?.floorCode || level}`;

      filteredScenes.forEach(scene => {
        const dot = document.createElement('div');
        dot.className = `map-dot ${scene.id === activeSceneId ? 'active' : ''}`;
        dot.style.left = `${scene.mapX}%`;
        dot.style.top = `${scene.mapY}%`;
        dot.title = scene.name;
        dot.onclick = () => loadScene(scene.id);
        mapContainer.appendChild(dot);
      });
    }

    function loadScene(sceneId) {
      const sceneData = scenes.find(s => s.id === sceneId);
      if (!sceneData) return;

      activeSceneId = sceneId;

      // Ensure correct floor button is highlighted if scene jumped floors
      if (sceneData.level !== currentFloor) {
        currentFloor = sceneData.level;
        document.querySelectorAll('.floor-box-btn').forEach(btn => btn.classList.remove('active'));
        const matchingBtn = document.querySelector(`.floor-box-btn[data-floor="${sceneData.level}"]`);
        if (matchingBtn) matchingBtn.classList.add('active');
      }

      // Update Sky Material
      const sky = document.getElementById('sky-sphere');
      sky.setAttribute('src', `#market-hall`);

      // Update Header Text
      document.getElementById('location-title').innerText = sceneData.name;
      document.getElementById('location-subtitle').innerText = `${sceneData.floorName} • Architectural 360 View`;

      // Update Ground Navigation Ring
      const hotspot = document.getElementById('hotspot-navigation');
      if (sceneData.nextTarget) {
        hotspot.setAttribute('visible', 'true');
        hotspot.setAttribute('position', sceneData.nextPos);
        hotspot.setAttribute('onclick', `loadScene('${sceneData.nextTarget}')`);
        hotspot.querySelector('a-text').setAttribute('value', sceneData.nextLabel);
      } else {
        hotspot.setAttribute('visible', 'false');
      }

      // Refresh Thumbnails and Minimap Pins
      updateFloorUI(sceneData.level);
    }
  </script>
</body>
</html>
