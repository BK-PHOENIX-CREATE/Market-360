<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market 360 - Virtual Experience</title>
  <!-- A-Frame WebXR Framework -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    @font-face {
      font-family: 'SF Pro Custom';
      src: url('SF-Pro-Text-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SF Pro Custom';
      src: url('SF-Pro-Text-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SF Pro Custom';
      src: url('SF-Pro-Text-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'SF Pro Custom', -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif !important;
      -webkit-font-smoothing: antialiased;
    }
    
    body, html { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #000000;
    }

    /* Startup Landing Screen */
    #startup-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background-color: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s;
    }

    #startup-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .bokeh-background {
      position: absolute;
      inset: -40px;
      background: url('market_render.JPG') center/cover no-repeat;
      filter: blur(35px) brightness(0.6) saturate(1.4);
      transform: scale(1.1);
      z-index: 1;
    }

    .bokeh-light {
      position: absolute;
      border-radius: 50%;
      filter: blur(30px);
      opacity: 0.45;
      mix-blend-mode: screen;
      animation: floatBokeh 10s infinite alternate ease-in-out;
      z-index: 2;
    }
    .bokeh-light.orb1 { width: 320px; height: 320px; background: #ffaa55; top: 10%; left: 15%; }
    .bokeh-light.orb2 { width: 400px; height: 400px; background: #4488ff; bottom: 15%; right: 10%; animation-duration: 13s; }
    .bokeh-light.orb3 { width: 250px; height: 250px; background: #ffffff; top: 50%; left: 70%; animation-duration: 8s; }

    @keyframes floatBokeh {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-40px) scale(1.15); }
    }

    .market-render-wrapper {
      position: relative;
      z-index: 3;
      width: 82vw;
      height: 72vh;
      max-width: 1200px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    .market-render-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      transition: transform 6s ease-out;
    }
    .market-render-wrapper:hover .market-render-image { transform: scale(1.06); }

    .center-cta-btn {
      position: absolute;
      z-index: 10;
      padding: 16px 42px;
      background: rgba(255, 255, 255, 0.18);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      border-radius: 40px;
      color: #ffffff;
      font-size: 19px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .center-cta-btn:hover {
      background: #ffffff;
      color: #111111;
      transform: scale(1.06);
    }

    .startup-logo {
      position: absolute;
      bottom: 24px;
      left: 28px;
      z-index: 10;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
    }
    .startup-logo img { width: 100%; height: 100%; object-fit: contain; }

    .startup-credits-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 32px;
      padding: 10px 28px;
      background: rgba(18, 18, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 30px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    .credit-item { display: flex; align-items: center; gap: 6px; color: #f5f5f7; font-size: 13px; white-space: nowrap; }
    .credit-label { color: rgba(255, 255, 255, 0.55); font-weight: 500; }
    .credit-value { font-weight: 700; }

    /* Top Overlay Header */
    .header-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), transparent);
      color: #ffffff;
      z-index: 100;
      pointer-events: auto;
    }
    .header-title h1 { font-size: 19px; font-weight: 700; }
    .header-title p { font-size: 12px; color: rgba(255, 255, 255, 0.75); margin-top: 2px; }

    .header-controls { display: flex; align-items: center; gap: 10px; }
    .audio-btn, .back-home-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .audio-btn:hover, .back-home-btn:hover { background: #ffffff; color: #111111; }

    /* Floor Dropdown */
    .floor-dropdown-wrapper {
      position: absolute;
      top: 80px;
      left: 24px;
      z-index: 110;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-bottom: 12px;
    }

    .floor-dropdown-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.88);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      border-radius: 12px;
      color: #1d1d1f;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      user-select: none;
    }

    .floor-dropdown-trigger .trigger-code {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 24px;
      padding: 0 6px;
      background: #0071e3;
      color: #ffffff;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .floor-dropdown-trigger .trigger-arrow {
      font-size: 10px;
      transition: transform 0.2s ease;
      color: #555555;
    }

    .floor-dropdown-menu::before {
      content: '';
      position: absolute;
      top: -12px;
      left: 0;
      width: 100%;
      height: 14px;
    }

    .floor-dropdown-menu {
      position: absolute;
      top: calc(100% - 4px);
      left: 0;
      width: 200px;
      background: rgba(20, 20, 24, 0.96);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
      pointer-events: none;
    }

    .floor-dropdown-wrapper:hover .floor-dropdown-menu,
    .floor-dropdown-wrapper.stay-open .floor-dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    .floor-dropdown-wrapper:hover .floor-dropdown-trigger,
    .floor-dropdown-wrapper.stay-open .floor-dropdown-trigger {
      background: #ffffff;
      border-color: #0071e3;
      box-shadow: 0 6px 20px rgba(0, 113, 227, 0.35);
    }

    .floor-dropdown-wrapper:hover .trigger-arrow,
    .floor-dropdown-wrapper.stay-open .trigger-arrow {
      transform: rotate(180deg);
      color: #0071e3;
    }

    .floor-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: #f5f5f7;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease, transform 0.15s ease, color 0.15s ease;
      width: 100%;
    }

    .floor-menu-item .menu-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 24px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .floor-menu-item .menu-label {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .floor-menu-item:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateX(3px);
      color: #ffffff;
    }

    .floor-menu-item:hover .menu-badge {
      background: #0071e3;
      border-color: #0077ed;
    }

    .floor-menu-item.active {
      background: rgba(0, 113, 227, 0.22);
      color: #ffffff;
      font-weight: 700;
    }

    .floor-menu-item.active .menu-badge {
      background: #0071e3;
      border-color: #0077ed;
      box-shadow: 0 0 10px rgba(0, 113, 227, 0.6);
    }

    /* Mini-Map in Bottom-Left */
    .minimap-container {
      position: absolute;
      bottom: 24px;
      left: 24px;
      width: 140px;
      height: 135px;
      background: rgba(24, 24, 28, 0.92);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      border-radius: 12px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      z-index: 100;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .minimap-container:hover {
      transform: translateY(-2px) scale(1.03);
      border-color: #0071e3;
      box-shadow: 0 10px 28px rgba(0, 113, 227, 0.4);
    }
    .minimap-header {
      width: 100%;
      padding: 5px 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #f5f5f7;
      font-size: 9.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .minimap-header span#map-header {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80px;
    }
    .minimap-header span.expand-hint {
      color: #0071e3;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .minimap-body {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      background: radial-gradient(circle at center, rgba(255,255,255,0.03), transparent 70%);
    }
    #minimap-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
    }

    /* Enlarged Blueprint Modal with Bokeh Background */
    #enlarged-map-modal {
      position: fixed;
      inset: 0;
      z-index: 99990;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    #enlarged-map-modal.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .map-modal-bokeh-bg {
      position: absolute;
      inset: -30px;
      background: url('market_render.JPG') center/cover no-repeat;
      filter: blur(40px) brightness(0.4) saturate(1.3);
      z-index: 1;
    }
    .enlarged-map-card {
      position: relative;
      z-index: 2;
      width: 82vw;
      max-width: 1050px;
      background: rgba(22, 22, 26, 0.92);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .enlarged-map-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffffff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 12px;
    }
    .enlarged-map-title h2 { font-size: 18px; font-weight: 700; }
    .enlarged-map-title p { font-size: 12px; color: rgba(255, 255, 255, 0.65); margin-top: 2px; }

    .close-map-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .close-map-btn:hover { background: #ffffff; color: #111111; }

    /* Centered Stage */
    .enlarged-blueprint-stage {
      position: relative;
      width: 100%;
      height: 56vh;
      min-height: 320px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Tight wrapper that hugs the rendered image so pins never float outside */
    .blueprint-image-wrapper {
      position: relative;
      display: inline-flex;
      max-width: 100%;
      max-height: 100%;
      align-items: center;
      justify-content: center;
    }

    #enlarged-blueprint-img {
      max-width: 100%;
      max-height: 54vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
      border-radius: 6px;
    }

    #pins-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Numbered Teleportation Nodes */
    .map-teleport-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #0071e3;
      border: 2px solid #ffffff;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(0, 113, 227, 0.9);
      transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s ease;
      z-index: 10;
      pointer-events: auto;
    }
    .map-teleport-pin:hover {
      background: #ffffff;
      color: #0071e3;
      transform: translate(-50%, -50%) scale(1.22);
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.9);
    }
    .map-teleport-pin.active-node {
      background: #34c759;
      box-shadow: 0 0 20px rgba(52, 199, 89, 0.9);
    }
    .map-teleport-pin span.pin-tooltip {
      position: absolute;
      bottom: 42px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .map-teleport-pin:hover span.pin-tooltip { opacity: 1; }

    /* Bottom Carousel Strip */
    .bottom-nav-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
      display: flex;
      justify-content: center;
      z-index: 90;
      pointer-events: none;
    }
    .bottom-nav-container > * { pointer-events: auto; }
    .thumbnail-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      max-width: 50vw;
      padding-bottom: 6px;
    }
    .thumb-card {
      position: relative;
      flex: 0 0 auto;
      width: 110px;
      height: 65px;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.25s ease;
      background: #111;
    }
    .thumb-card img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-card span {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      font-size: 10px;
      font-weight: 500;
      padding: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .thumb-card.active { border-color: #0071e3; box-shadow: 0 0 12px rgba(0, 113, 227, 0.8); }
  </style>
</head>
<body>

  <!-- ==================== STARTUP LANDING OVERLAY ==================== -->
  <div id="startup-screen">
    <div class="bokeh-background"></div>
    <div class="bokeh-light orb1"></div>
    <div class="bokeh-light orb2"></div>
    <div class="bokeh-light orb3"></div>

    <div class="market-render-wrapper">
      <img src="market_render.JPG" alt="Overall Market Render" class="market-render-image">
      <button class="center-cta-btn" onclick="startNavigationExperience()">Let's Navigate</button>
    </div>

    <div class="startup-logo">
      <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    </div>

    <div class="startup-credits-bar">
      <div class="credit-item"><span class="credit-label">Name:</span><span class="credit-value">Balakrishna Darla</span></div>
      <div class="credit-item"><span class="credit-label">Year:</span><span class="credit-value">Vth Year</span></div>
      <div class="credit-item"><span class="credit-label">Sem:</span><span class="credit-value">IX</span></div>
      <div class="credit-item"><span class="credit-label">Roll no:</span><span class="credit-value">Vu22arch0100016</span></div>
    </div>
  </div>

  <!-- Ambient Audio -->
  <audio id="ambient-audio" loop preload="none" crossorigin="anonymous">
    <source src="https://upload.wikimedia.org/wikipedia/commons/e/ec/Wind_blowing_at_mountain_pass.ogg" type="audio/ogg">
    <source src="https://actions.google.com/sounds/v1/weather/wind_arctic_constant.ogg" type="audio/ogg">
  </audio>

  <!-- Top Header UI -->
  <div class="header-bar">
    <div class="header-title">
      <h1 id="location-title">Upper Junction</h1>
      <p id="location-subtitle">Site • Architectural 360 Panorama</p>
    </div>
    <div class="header-controls">
      <button class="back-home-btn" onclick="returnToStartup()"><span>🏠</span> <span>Home</span></button>
      <button id="sound-btn" class="audio-btn" onclick="toggleAudio()"><span id="sound-icon">🔈</span> <span id="sound-label">Enable Ambience</span></button>
    </div>
  </div>

  <!-- ==================== FLOOR DROPDOWN ==================== -->
  <div class="floor-dropdown-wrapper" id="floor-dropdown">
    <div class="floor-dropdown-trigger" id="floor-trigger">
      <span class="trigger-code" id="active-floor-badge">S</span>
      <span id="active-floor-name">Site</span>
      <span class="trigger-arrow">▾</span>
    </div>

    <!-- Dropdown Menu -->
    <div class="floor-dropdown-menu" id="floor-menu">
      <button class="floor-menu-item" data-floor="7" onclick="switchFloor(7, this, event)">
        <span class="menu-badge">TR</span>
        <span class="menu-label">Terrace</span>
      </button>
      <button class="floor-menu-item" data-floor="6" onclick="switchFloor(6, this, event)">
        <span class="menu-badge">3</span>
        <span class="menu-label">Third Floor</span>
      </button>
      <button class="floor-menu-item" data-floor="5" onclick="switchFloor(5, this, event)">
        <span class="menu-badge">2</span>
        <span class="menu-label">Second Floor</span>
      </button>
      <button class="floor-menu-item" data-floor="4" onclick="switchFloor(4, this, event)">
        <span class="menu-badge">1</span>
        <span class="menu-label">First Floor</span>
      </button>
      <button class="floor-menu-item" data-floor="3" onclick="switchFloor(3, this, event)">
        <span class="menu-badge">G</span>
        <span class="menu-label">Ground Floor</span>
      </button>
      <button class="floor-menu-item" data-floor="2" onclick="switchFloor(2, this, event)">
        <span class="menu-badge">P1</span>
        <span class="menu-label">Podium-1</span>
      </button>
      <button class="floor-menu-item" data-floor="1" onclick="switchFloor(1, this, event)">
        <span class="menu-badge">ST</span>
        <span class="menu-label">Stilt Floor</span>
      </button>
      <button class="floor-menu-item active" data-floor="0" onclick="switchFloor(0, this, event)">
        <span class="menu-badge">S</span>
        <span class="menu-label">Site</span>
      </button>
    </div>
  </div>

  <!-- Bottom-Left Mini-Map -->
  <div class="minimap-container" onclick="openEnlargedMap()" title="Click to enlarge floor plan and view teleport points">
    <div class="minimap-header">
      <span id="map-header">Site Layout Plan</span>
      <span class="expand-hint">⤢ ENLARGE</span>
    </div>
    <div class="minimap-body">
      <img id="minimap-img" src="site_plan.png" onerror="this.src='market_render.JPG'" alt="Current Floor Plan">
    </div>
  </div>

  <!-- Enlarged Blueprint Modal with Bokeh Background & Precise Pin Alignment -->
  <div id="enlarged-map-modal" class="hidden">
    <div class="map-modal-bokeh-bg" onclick="closeEnlargedMap()"></div>
    <div class="enlarged-map-card">
      <div class="enlarged-map-header-bar">
        <div class="enlarged-map-title">
          <h2 id="enlarged-modal-title">Interactive Floor Plan</h2>
          <p>Select any numbered station point to teleport directly to that 360 view</p>
        </div>
        <button class="close-map-btn" onclick="closeEnlargedMap()">✕ Close Map</button>
      </div>

      <div class="enlarged-blueprint-stage">
        <!-- Wrapper ensuring pins align precisely with the image bounds -->
        <div class="blueprint-image-wrapper">
          <img id="enlarged-blueprint-img" src="site_plan.png" onerror="this.src='market_render.JPG'" alt="Enlarged Blueprint">
          <div id="pins-container"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Carousel -->
  <div class="bottom-nav-container">
    <div class="thumbnail-strip" id="thumb-strip"></div>
  </div>

  <!-- A-Frame VR Canvas -->
  <a-scene id="vr-scene" embedded vr-mode-ui="enabled: true">
    <a-entity id="cameraRig" position="0 0 0">
      <a-camera id="camera" look-controls wasd-controls="enabled: false">
        <a-cursor 
          id="cursor"
          color="#FFFFFF"
          raycaster="objects: .clickable"
          animation__click="property: scale; startEvents: click; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1">
        </a-cursor>
        <a-sphere 
          id="fade-sphere" 
          radius="0.1" 
          position="0 0 -0.05"
          material="color: #000000; side: back; shader: flat; transparent: true; opacity: 0"
          visible="false">
        </a-sphere>
      </a-camera>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
    </a-entity>

    <a-sky id="sky-sphere" src="site_1.png" rotation="0 -90 0"></a-sky>

    <a-entity id="hotspot-navigation" class="clickable" position="0 -1.6 -4" rotation="-90 0 0">
      <a-ring radius-inner="0.3" radius-outer="0.45" color="#FFFFFF" opacity="0.85"></a-ring>
      <a-circle radius="0.3" color="#0071E3" opacity="0.65"></a-circle>
      <a-text 
        value="Explore" 
        align="center" 
        position="0 -0.8 0" 
        rotation="90 0 0" 
        scale="1.2 1.2 1.2" 
        color="#FFFFFF">
      </a-text>
    </a-entity>
  </a-scene>

  <script>
    const audio = document.getElementById('ambient-audio');
    const soundBtn = document.getElementById('sound-btn');
    const soundLabel = document.getElementById('sound-label');
    const soundIcon = document.getElementById('sound-icon');
    let isPlaying = false;
    let isTransitioning = false;

    // Dropdown interactions
    const dropdownWrapper = document.getElementById('floor-dropdown');
    const dropdownTrigger = document.getElementById('floor-trigger');
    const dropdownMenu = document.getElementById('floor-menu');

    dropdownTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownWrapper.classList.toggle('stay-open');
    });

    window.addEventListener('click', (e) => {
      if (dropdownWrapper && !dropdownWrapper.contains(e.target)) {
        dropdownWrapper.classList.remove('stay-open');
      }
    });

    function startNavigationExperience() {
      document.getElementById('startup-screen').classList.add('hidden');
      if (!isPlaying) toggleAudio();
    }

    function returnToStartup() {
      document.getElementById('startup-screen').classList.remove('hidden');
    }

    function toggleAudio() {
      if (isPlaying) {
        audio.pause();
        soundLabel.innerText = "Enable Ambience";
        soundIcon.innerText = "🔈";
        isPlaying = false;
      } else {
        audio.volume = 0.4;
        audio.play().then(() => {
          soundLabel.innerText = "Mute Ambience";
          soundIcon.innerText = "🔊";
          isPlaying = true;
        }).catch(err => console.warn(err));
      }
    }

    /* 
      SITE TELEPORT POINTS:
      Point 1: Upper Junction
      Point 2: Lower Right Avenue
      Point 3: West Entrance Street
    */
    const floorPlansConfig = [
      {
        level: 0,
        floorName: "Site",
        floorCode: "S",
        planImg: "site_plan.png",
        planTitle: "Site Layout Plan",
        fallbackImg: "market_render.JPG",
        points: [
          { id: "site-node-1", name: "Upper Junction", pinNum: "1", pinX: 62.5, pinY: 21, src: "site_1.png", fallbackSrc: "market_render.JPG" },
          { id: "site-node-2", name: "Lower Right Avenue", pinNum: "2", pinX: 69, pinY: 69, src: "site_2.png", fallbackSrc: "market_render.JPG" },
          { id: "site-node-3", name: "West Entrance Street", pinNum: "3", pinX: 14.5, pinY: 55, src: "site_3.png", fallbackSrc: "market_render.JPG" }
        ]
      },
      {
        level: 1,
        floorName: "Stilt Floor",
        floorCode: "ST",
        planImg: "stilt_plan.png",
        planTitle: "Stilt Parking & Entry Plan",
        fallbackImg: "market_render.JPG",
        points: [
          { id: "stilt-node-1", name: "Stilt Access", pinNum: "1", pinX: 30, pinY: 50, src: "stilt_1.png", fallbackSrc: "market_render.JPG" }
        ]
      },
      {
        level: 2,
        floorName: "Podium-1",
        floorCode: "P1",
        planImg: "podium_plan.png",
        planTitle: "Podium-1 Promenade Plan",
        fallbackImg: "market_render.JPG",
        points: [
          { id: "podium-node-1", name: "Podium Walkway", pinNum: "1", pinX: 50, pinY: 50, src: "podium_1.png", fallbackSrc: "market_render.JPG" }
        ]
      },
      {
        level: 3,
        floorName: "Ground Floor",
        floorCode: "G",
        planImg: "ground_plan.png",
        planTitle: "Ground Floor Market Plan",
        fallbackImg: "market_render.JPG",
        points: [
          { id: "ground-node-1", name: "Ground Market Hall", pinNum: "1", pinX: 35, pinY: 45, src: "ground_1.png", fallbackSrc: "market_render.JPG" },
          { id: "ground-node-2", name: "Atrium Plaza", pinNum: "2", pinX: 65, pinY: 55, src: "ground_2.png", fallbackSrc: "market_render.JPG" }
        ]
      },
      {
        level: 4,
        floorName: "First Floor",
        floorCode: "1",
        planImg: "first_plan.png",
        planTitle: "First Floor Corridor Plan",
        fallbackImg: "market_render.JPG",
        points: [
          { id: "first-node-1", name: "First Floor Corridor", pinNum: "1", pinX: 40, pinY: 50, src: "first_1.png", fallbackSrc: "market_render.JPG" }
        ]
      },
      {
        level: 5,
        floorName: "Second Floor",
        floorCode: "2",
        planImg: "second_plan.png",
        planTitle: "Second Floor Gallery Plan",
        fallbackImg: "market_render.JPG",
        points: [
          { id: "second-node-1", name: "Station 1", pinNum: "1", pinX: 25, pinY: 50, src: "second_1.png", fallbackSrc: "market_render.JPG" },
          { id: "second-node-2", name: "Station 2", pinNum: "2", pinX: 70, pinY: 50, src: "second_2.png", fallbackSrc: "market_render.JPG" }
        ]
      },
      {
        level: 6,
        floorName: "Third Floor",
        floorCode: "3",
        planImg: "third_plan.png",
        planTitle: "Third Floor Deck Plan",
        fallbackImg: "market_render.JPG",
        points: [
          { id: "third-node-1", name: "Upper Deck", pinNum: "1", pinX: 50, pinY: 50, src: "third_1.png", fallbackSrc: "market_render.JPG" }
        ]
      },
      {
        level: 7,
        floorName: "Terrace",
        floorCode: "TR",
        planImg: "terrace_plan.png",
        planTitle: "Rooftop Terrace Plan",
        fallbackImg: "market_render.JPG",
        points: [
          { id: "terrace-node-1", name: "Rooftop Overlook", pinNum: "1", pinX: 50, pinY: 50, src: "terrace_1.png", fallbackSrc: "market_render.JPG" }
        ]
      }
    ];

    let currentFloorLevel = 0;
    let activePointId = "site-node-1";

    window.onload = () => {
      loadFloorAndPoint(0, "site-node-1", false);
    };

    function openEnlargedMap() {
      const modal = document.getElementById('enlarged-map-modal');
      const enlargedImg = document.getElementById('enlarged-blueprint-img');
      const modalTitle = document.getElementById('enlarged-modal-title');
      const pinsContainer = document.getElementById('pins-container');

      const floorConfig = floorPlansConfig.find(f => f.level === currentFloorLevel) || floorPlansConfig[0];
      
      enlargedImg.src = floorConfig.planImg;
      enlargedImg.onerror = () => { enlargedImg.src = floorConfig.fallbackImg; };
      modalTitle.innerText = `${floorConfig.floorName} - ${floorConfig.planTitle}`;

      pinsContainer.innerHTML = '';
      floorConfig.points.forEach((pt) => {
        const pin = document.createElement('div');
        pin.className = `map-teleport-pin ${pt.id === activePointId ? 'active-node' : ''}`;
        pin.style.left = `${pt.pinX}%`;
        pin.style.top = `${pt.pinY}%`;
        pin.innerHTML = `
          ${pt.pinNum}
          <span class="pin-tooltip">${pt.name}</span>
        `;
        pin.onclick = (e) => {
          e.stopPropagation();
          closeEnlargedMap();
          loadFloorAndPoint(currentFloorLevel, pt.id, true);
        };
        pinsContainer.appendChild(pin);
      });

      modal.classList.remove('hidden');
    }

    function closeEnlargedMap() {
      document.getElementById('enlarged-map-modal').classList.add('hidden');
    }

    function switchFloor(floorNum, btnElement, e) {
      if (e) e.stopPropagation();
      if (isTransitioning) return;
      currentFloorLevel = floorNum;

      dropdownWrapper.classList.remove('stay-open');
      dropdownMenu.style.pointerEvents = 'none';
      setTimeout(() => { dropdownMenu.style.pointerEvents = ''; }, 300);

      document.querySelectorAll('.floor-menu-item').forEach(btn => btn.classList.remove('active'));
      if (btnElement) {
        btnElement.classList.add('active');
      } else {
        const matchingBtn = document.querySelector(`.floor-menu-item[data-floor="${floorNum}"]`);
        if (matchingBtn) matchingBtn.classList.add('active');
      }

      const floorConfig = floorPlansConfig.find(f => f.level === floorNum);
      if (floorConfig) {
        const badge = document.getElementById('active-floor-badge');
        const nameLabel = document.getElementById('active-floor-name');
        if (badge) badge.innerText = floorConfig.floorCode;
        if (nameLabel) nameLabel.innerText = floorConfig.floorName;
      }

      const firstPoint = floorConfig ? floorConfig.points[0] : null;
      loadFloorAndPoint(floorNum, firstPoint ? firstPoint.id : null, true);
    }

    function loadFloorAndPoint(floorNum, pointId, animate = true) {
      if (isTransitioning && animate) return;
      const floorConfig = floorPlansConfig.find(f => f.level === floorNum);
      if (!floorConfig) return;

      const pointData = floorConfig.points.find(p => p.id === pointId) || floorConfig.points[0];
      if (!pointData) return;

      activePointId = pointData.id;
      currentFloorLevel = floorNum;

      const badge = document.getElementById('active-floor-badge');
      const nameLabel = document.getElementById('active-floor-name');
      if (badge) badge.innerText = floorConfig.floorCode;
      if (nameLabel) nameLabel.innerText = floorConfig.floorName;

      document.querySelectorAll('.floor-menu-item').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.getAttribute('data-floor')) === floorNum);
      });

      const fadeSphere = document.getElementById('fade-sphere');
      const cameraRig = document.getElementById('cameraRig');

      if (!animate) {
        applyView(floorConfig, pointData);
        return;
      }

      isTransitioning = true;
      fadeSphere.setAttribute('visible', 'true');
      fadeSphere.setAttribute('animation', { property: 'material.opacity', from: 0, to: 1, dur: 350, easing: 'easeInQuad' });

      setTimeout(() => {
        applyView(floorConfig, pointData);
        fadeSphere.setAttribute('animation', { property: 'material.opacity', from: 1, to: 0, dur: 400, easing: 'easeOutQuad' });
        setTimeout(() => {
          fadeSphere.setAttribute('visible', 'false');
          fadeSphere.removeAttribute('animation');
          isTransitioning = false;
        }, 410);
      }, 360);
    }

    function applyView(floorConfig, pointData) {
      document.getElementById('location-title').innerText = pointData.name;
      document.getElementById('location-subtitle').innerText = `${floorConfig.floorName} • Architectural 360 Panorama`;

      const mapImg = document.getElementById('minimap-img');
      const mapHeader = document.getElementById('map-header');
      mapImg.src = floorConfig.planImg;
      mapImg.onerror = () => { mapImg.src = floorConfig.fallbackImg; };
      mapHeader.innerText = floorConfig.planTitle;

      const sky = document.getElementById('sky-sphere');
      const loader = new THREE.TextureLoader();
      loader.load(pointData.src, function(texture) {
        const mesh = sky.getObject3D('mesh');
        if (mesh) { mesh.material.map = texture; mesh.material.needsUpdate = true; }
      }, undefined, function() {
        loader.load(pointData.fallbackSrc, function(fallbackTexture) {
          const mesh = sky.getObject3D('mesh');
          if (mesh) { mesh.material.map = fallbackTexture; mesh.material.needsUpdate = true; }
        });
      });

      const thumbStrip = document.getElementById('thumb-strip');
      thumbStrip.innerHTML = '';
      floorConfig.points.forEach(pt => {
        const card = document.createElement('div');
        card.className = `thumb-card ${pt.id === activePointId ? 'active' : ''}`;
        card.onclick = () => loadFloorAndPoint(floorConfig.level, pt.id, true);
        card.innerHTML = `
          <img src="${pt.src}" onerror="this.src='${pt.fallbackSrc}'" alt="${pt.name}">
          <span>Point ${pt.pinNum}: ${pt.name}</span>
        `;
        thumbStrip.appendChild(card);
      });
    }
  </script>
</body>
</html>
