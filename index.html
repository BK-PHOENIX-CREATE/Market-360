<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Floor Market 360 VR Experience</title>
  <!-- A-Frame WebXR Framework -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* Top Overlay Header */
    .header-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), transparent);
      color: #ffffff;
      z-index: 100;
      pointer-events: auto;
    }

    .header-title h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.2px; }
    .header-title p { font-size: 12px; color: rgba(255, 255, 255, 0.75); margin-top: 2px; }

    /* Audio Toggle Button */
    .audio-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .audio-btn:hover {
      background: #ffffff;
      color: #111111;
    }

    /* Bottom Overlay Navigation */
    .bottom-nav-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.4) 70%, transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 100;
    }

    /* Floor Buttons */
    .level-selector { display: flex; gap: 8px; }

    .level-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
    }

    .level-btn.active, .level-btn:hover {
      background: #ffffff;
      color: #111111;
      font-weight: 600;
    }

    /* Thumbnail Strip */
    .thumbnail-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      max-width: 90vw;
      padding-bottom: 6px;
    }

    .thumb-card {
      position: relative;
      flex: 0 0 auto;
      width: 110px;
      height: 65px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .thumb-card img { width: 100%; height: 100%; object-fit: cover; }

    .thumb-card span {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      font-size: 10px;
      padding: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thumb-card.active {
      border-color: #4285F4;
      box-shadow: 0 0 10px rgba(66, 133, 244, 0.8);
    }
  </style>
</head>
<body>

  <!-- Ambient Audio for Open-air Decks & Terraces -->
  <audio id="ambient-audio" loop preload="auto" crossorigin="anonymous">
    <source src="https://upload.wikimedia.org/wikipedia/commons/e/ec/Wind_blowing_at_mountain_pass.ogg" type="audio/ogg">
    <source src="https://actions.google.com/sounds/v1/weather/wind_arctic_constant.ogg" type="audio/ogg">
  </audio>

  <!-- Top Header UI -->
  <div class="header-bar">
    <div class="header-title">
      <h1 id="location-title">Central Market Plaza</h1>
      <p id="location-subtitle">Ground Floor • Architectural 360 View</p>
    </div>
    <button id="sound-btn" class="audio-btn" onclick="toggleAudio()">
      <span id="sound-icon">🔈</span> <span id="sound-label">Enable Ambience</span>
    </button>
  </div>

  <!-- Bottom Floor & Scene Controls -->
  <div class="bottom-nav-container">
    <div class="level-selector">
      <button class="level-btn active" onclick="filterByLevel(0, this)">Ground Floor</button>
      <button class="level-btn" onclick="filterByLevel(1, this)">First Floor</button>
      <button class="level-btn" onclick="filterByLevel(2, this)">Rooftop Terrace</button>
    </div>

    <div class="thumbnail-strip" id="thumb-strip">
      <!-- Generated automatically -->
    </div>
  </div>

  <!-- A-Frame VR Canvas -->
  <a-scene embedded vr-mode-ui="enabled: true">
    <a-assets>
      <!-- Enscape Render Assets (Default fallback points to market.jpg) -->
      <img id="img-ground-plaza" src="market.jpg">
      <img id="img-ground-arcade" src="market.jpg">
      <img id="img-floor1-atrium" src="market.jpg">
      <img id="img-floor1-shops" src="market.jpg">
      <img id="img-rooftop-market" src="market.jpg">
    </a-assets>

    <!-- Camera Controller & Reticle for Headsets -->
    <a-entity id="cameraRig">
      <a-camera id="camera" look-controls>
        <a-cursor 
          id="cursor"
          color="#FFFFFF"
          raycaster="objects: .clickable"
          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1">
        </a-cursor>
      </a-camera>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
    </a-entity>

    <!-- 360 Sky Sphere -->
    <a-sky id="sky-sphere" src="#img-ground-plaza" rotation="0 -90 0"></a-sky>

    <!-- Ground Hotspot Navigation (Street View Ring Marker) -->
    <a-entity id="hotspot-navigation" class="clickable" position="0 -1.8 -4" rotation="-90 0 0">
      <a-ring radius-inner="0.3" radius-outer="0.45" color="#FFFFFF" opacity="0.85"></a-ring>
      <a-circle radius="0.3" color="#4285F4" opacity="0.5"></a-circle>
      <a-text value="Walk Forward" align="center" position="0 -0.8 0" rotation="90 0 0" scale="1.2 1.2 1.2" color="#FFFFFF"></a-text>
    </a-entity>
  </a-scene>

  <script>
    // Audio Player Toggle
    const audio = document.getElementById('ambient-audio');
    const soundBtn = document.getElementById('sound-btn');
    const soundLabel = document.getElementById('sound-label');
    const soundIcon = document.getElementById('sound-icon');
    let isPlaying = false;

    function toggleAudio() {
      if (isPlaying) {
        audio.pause();
        soundLabel.innerText = "Enable Ambience";
        soundIcon.innerText = "🔈";
        isPlaying = false;
      } else {
        audio.volume = 0.4;
        audio.play().then(() => {
          soundLabel.innerText = "Mute Ambience";
          soundIcon.innerText = "🔊";
          isPlaying = true;
        }).catch(err => console.warn("Audio waiting for user click:", err));
      }
    }

    document.querySelector('a-scene').addEventListener('enter-vr', () => {
      if (!isPlaying) toggleAudio();
    });

    // Multi-Floor Market Database
    // Replace 'market.jpg' with your exported renders (e.g., 'g_plaza.jpg', 'f1_atrium.jpg')
    const scenes = [
      // Ground Floor (Level 0)
      { 
        id: 'img-ground-plaza', 
        name: 'Central Plaza Entrance', 
        floorName: 'Ground Floor',
        level: 0, 
        src: 'market.jpg', 
        nextTarget: 'img-ground-arcade', 
        nextLabel: 'Walk to Food Arcade', 
        nextPos: '0 -1.8 -4' 
      },
      { 
        id: 'img-ground-arcade', 
        name: 'Covered Food Arcade', 
        floorName: 'Ground Floor',
        level: 0, 
        src: 'market.jpg', 
        nextTarget: 'img-floor1-atrium', 
        nextLabel: 'Take Escalator to Level 1', 
        nextPos: '3 -1.8 -3' 
      },

      // First Floor (Level 1)
      { 
        id: 'img-floor1-atrium', 
        name: 'First Floor Mezzanine', 
        floorName: 'First Floor',
        level: 1, 
        src: 'market.jpg', 
        nextTarget: 'img-floor1-shops', 
        nextLabel: 'Browse Retail Stalls', 
        nextPos: '-3 -1.8 -3' 
      },
      { 
        id: 'img-floor1-shops', 
        name: 'Artisan Boutique Walk', 
        floorName: 'First Floor',
        level: 1, 
        src: 'market.jpg', 
        nextTarget: 'img-rooftop-market', 
        nextLabel: 'Go up to Rooftop Deck', 
        nextPos: '0 -1.8 -4' 
      },

      // Rooftop / Terrace (Level 2)
      { 
        id: 'img-rooftop-market', 
        name: 'Open Air Rooftop Market', 
        floorName: 'Rooftop Terrace',
        level: 2, 
        src: 'market.jpg', 
        nextTarget: 'img-ground-plaza', 
        nextLabel: 'Take Elevator to Ground', 
        nextPos: '0 -1.8 4' 
      }
    ];

    let activeSceneId = 'img-ground-plaza';

    window.onload = () => { renderThumbnails(0); };

    function renderThumbnails(level) {
      const container = document.getElementById('thumb-strip');
      container.innerHTML = '';

      const filteredScenes = scenes.filter(s => s.level === level);

      filteredScenes.forEach(scene => {
        const card = document.createElement('div');
        card.className = `thumb-card ${scene.id === activeSceneId ? 'active' : ''}`;
        card.onclick = () => loadScene(scene.id);

        card.innerHTML = `
          <img src="${scene.src}" alt="${scene.name}">
          <span>${scene.name}</span>
        `;
        container.appendChild(card);
      });
    }

    function filterByLevel(level, btnElement) {
      document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      renderThumbnails(level);
    }

    function loadScene(sceneId) {
      const sceneData = scenes.find(s => s.id === sceneId);
      if (!sceneData) return;

      activeSceneId = sceneId;

      // Swap Sky Background
      const sky = document.getElementById('sky-sphere');
      sky.setAttribute('src', `#${sceneData.id}`);

      // Update Text Overlay
      document.getElementById('location-title').innerText = sceneData.name;
      document.getElementById('location-subtitle').innerText = `${sceneData.floorName} • Architectural 360 View`;

      // Update Ground Navigation Arrow/Ring
      const hotspot = document.getElementById('hotspot-navigation');
      if (sceneData.nextTarget) {
        hotspot.setAttribute('visible', 'true');
        hotspot.setAttribute('position', sceneData.nextPos);
        hotspot.setAttribute('onclick', `loadScene('${sceneData.nextTarget}')`);
        hotspot.querySelector('a-text').setAttribute('value', sceneData.nextLabel);
      } else {
        hotspot.setAttribute('visible', 'false');
      }

      // Refresh thumbnail highlight
      renderThumbnails(sceneData.level);
    }
  </script>
</body>
</html>
