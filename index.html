<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market 360 - Redevelopment of Poorna Market</title>
  <!-- A-Frame WebXR Framework -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    @font-face {
      font-family: 'SF Pro Custom';
      src: url('SF-Pro-Text-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SF Pro Custom';
      src: url('SF-Pro-Text-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SF Pro Custom';
      src: url('SF-Pro-Text-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'SF Pro Custom', -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif !important;
      -webkit-font-smoothing: antialiased;
    }
    
    body, html { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #000000;
      color: #ffffff;
    }

    /* =========================================================
       PAGE 1: STARTUP LANDING OVERLAY
       ========================================================= */
    #startup-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background-color: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s;
    }

    #startup-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .bokeh-background {
      position: absolute;
      inset: -40px;
      background: url('market_render.JPG') center/cover no-repeat;
      filter: blur(35px) brightness(0.6) saturate(1.4);
      transform: scale(1.1);
      z-index: 1;
    }

    .bokeh-light {
      position: absolute;
      border-radius: 50%;
      filter: blur(30px);
      opacity: 0.45;
      mix-blend-mode: screen;
      animation: floatBokeh 10s infinite alternate ease-in-out;
      z-index: 2;
    }
    .bokeh-light.orb1 { width: 320px; height: 320px; background: #ffaa55; top: 10%; left: 15%; }
    .bokeh-light.orb2 { width: 400px; height: 400px; background: #4488ff; bottom: 15%; right: 10%; animation-duration: 13s; }
    .bokeh-light.orb3 { width: 250px; height: 250px; background: #ffffff; top: 50%; left: 70%; animation-duration: 8s; }

    @keyframes floatBokeh {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-40px) scale(1.15); }
    }

    .market-render-wrapper {
      position: relative;
      z-index: 3;
      width: 82vw;
      height: 72vh;
      max-width: 1200px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    .market-render-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      transition: transform 6s ease-out;
    }
    .market-render-wrapper:hover .market-render-image { transform: scale(1.06); }

    .center-cta-btn {
      position: absolute;
      z-index: 10;
      padding: 16px 42px;
      background: rgba(255, 255, 255, 0.18);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      border-radius: 40px;
      color: #ffffff;
      font-size: 19px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .center-cta-btn:hover {
      background: #ffffff;
      color: #111111;
      transform: scale(1.06);
    }

    .startup-logo {
      position: absolute;
      bottom: 24px;
      left: 28px;
      z-index: 10;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
    }
    .startup-logo img { width: 100%; height: 100%; object-fit: contain; }

    .startup-credits-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
