<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market 360 - Multi-Floor Virtual Experience</title>
  <!-- A-Frame WebXR Framework -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* Top Overlay Header */
    .header-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), transparent);
      color: #ffffff;
      z-index: 100;
      pointer-events: auto;
    }

    .header-title h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.2px; }
    .header-title p { font-size: 12px; color: rgba(255, 255, 255, 0.75); margin-top: 2px; }

    /* Audio Toggle Button */
    .audio-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .audio-btn:hover { background: #ffffff; color: #111111; }

    /* --- VERTICAL FLOOR ELEVATOR SWITCHER (Left Side) --- */
    .floor-elevator-nav {
      position: absolute;
      top: 90px;
      left: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }

    .floor-box-btn {
      width: 42px;
      height: 42px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #333333;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .floor-box-btn:hover {
      background: #ffffff;
      transform: scale(1.05);
    }

    .floor-box-btn.active {
      background: #4285F4;
      color: #ffffff;
      border-color: #1a73e8;
      box-shadow: 0 0 12px rgba(66, 133, 244, 0.7);
    }

    /* --- INTERACTIVE NAVIGATION CORRIDOR MAP (Bottom Left) --- */
    .minimap-container {
      position: absolute;
      bottom: 24px;
      left: 24px;
      width: 380px;
      max-width: 45vw;
      height: 90px;
      background: rgba(20, 20, 20, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 10px;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      z-index: 100;
      overflow: hidden;
      cursor: pointer;
    }

    .minimap-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 3px 8px;
      background: rgba(0, 0, 0, 0.65);
      color: #eee;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      z-index: 2;
    }

    .minimap-body {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 14px;
    }

    #minimap-img {
      width: 95%;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    /* Bottom Navigation Carousel */
    .bottom-nav-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.4) 70%, transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 90;
      pointer-events: none;
    }

    .bottom-nav-container > * { pointer-events: auto; }

    .thumbnail-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      max-width: 50vw;
      padding-bottom: 6px;
    }

    .thumb-card {
      position: relative;
      flex: 0 0 auto;
      width: 110px;
      height: 65px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .thumb-card img { width: 100%; height: 100%; object-fit: cover; }

    .thumb-card span {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      font-size: 10px;
      padding: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thumb-card.active {
      border-color: #4285F4;
      box-shadow: 0 0 10px rgba(66, 133, 244, 0.8);
    }
  </style>
</head>
<body>

  <!-- Ambient Audio for Mountain & Market -->
  <audio id="ambient-audio" loop preload="auto" crossorigin="anonymous">
    <source src="https://upload.wikimedia.org/wikipedia/commons/e/ec/Wind_blowing_at_mountain_pass.ogg" type="audio/ogg">
    <source src="https://actions.google.com/sounds/v1/weather/wind_arctic_constant.ogg" type="audio/ogg">
  </audio>

  <!-- Top Header UI -->
  <div class="header-bar">
    <div class="header-title">
      <h1 id="location-title">2nd Floor Market Gallery - Station 1</h1>
      <p id="location-subtitle">Second Floor • Architectural 360 Panorama</p>
    </div>
    <button id="sound-btn" class="audio-btn" onclick="toggleAudio()">
      <span id="sound-icon">🔈</span> <span id="sound-label">Enable Ambience</span>
    </button>
  </div>

  <!-- 1. VERTICAL FLOOR ELEVATOR SWITCHER -->
  <div class="floor-elevator-nav">
    <button class="floor-box-btn" data-floor="3" onclick="switchFloor(3, this)" title="Level 3 / Rooftop">3</button>
    <button class="floor-box-btn active" data-floor="2" onclick="switchFloor(2, this)" title="Level 2 / Market Gallery">2</button>
    <button class="floor-box-btn" data-floor="1" onclick="switchFloor(1, this)" title="Level 1 / Exhibition Corridor">1</button>
    <button class="floor-box-btn" data-floor="0" onclick="switchFloor(0, this)" title="Ground Floor">G</button>
  </div>

  <!-- 2. NAVIGATION FLOOR PLAN SEEKER (Bottom Left) -->
  <div class="minimap-container" onclick="toggleFloor2Node()" title="Click to toggle station view">
    <div class="minimap-header" id="map-header">Level 2 Corridor Plan: Station 1</div>
    <div class="minimap-body">
      <img id="minimap-img" src="panorama_1_plan.png" alt="Corridor Map Plan">
    </div>
  </div>

  <!-- Bottom Navigation Carousel -->
  <div class="bottom-nav-container">
    <div class="thumbnail-strip" id="thumb-strip">
      <!-- Generated dynamically -->
    </div>
  </div>

  <!-- A-Frame VR Canvas -->
  <a-scene embedded vr-mode-ui="enabled: true">
    <a-assets>
      <!-- Ground Floor Render -->
      <img id="ground-render" src="ground_floor.jpg">
      <!-- First Floor Corridor Render -->
      <img id="floor1-render" src="firstfloorcorridor_1.jpg">
      <!-- Second Floor Renders -->
      <img id="floor2-render-1" src="panorama_1.jpg">
      <img id="floor2-render-2" src="panorama_2.jpg">
      <!-- Fallback Render -->
      <img id="fallback-render" src="market.jpg">
    </a-assets>

    <!-- Camera Controller & Reticle for VR -->
    <a-entity id="cameraRig">
      <a-camera id="camera" look-controls>
        <a-cursor 
          id="cursor"
          color="#FFFFFF"
          raycaster="objects: .clickable"
          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1">
        </a-cursor>
      </a-camera>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
    </a-entity>

    <!-- 360 Sky Sphere -->
    <a-sky id="sky-sphere" src="#floor2-render-1" rotation="0 -90 0"></a-sky>

    <!-- Ground Hotspot Navigation Marker (Walk Seeker) -->
    <a-entity id="hotspot-navigation" class="clickable" position="0 -1.6 -4" rotation="-90 0 0">
      <a-ring radius-inner="0.3" radius-outer="0.45" color="#FFFFFF" opacity="0.85"></a-ring>
      <a-circle radius="0.3" color="#4285F4" opacity="0.5"></a-circle>
      <a-text value="Walk Forward" align="center" position="0 -0.8 0" rotation="90 0 0" scale="1.2 1.2 1.2" color="#FFFFFF"></a-text>
    </a-entity>
  </a-scene>

  <script>
    // Audio Player Toggle
    const audio = document.getElementById('ambient-audio');
    const soundBtn = document.getElementById('sound-btn');
    const soundLabel = document.getElementById('sound-label');
    const soundIcon = document.getElementById('sound-icon');
    let isPlaying = false;

    function toggleAudio() {
      if (isPlaying) {
        audio.pause();
        soundLabel.innerText = "Enable Ambience";
        soundIcon.innerText = "🔈";
        isPlaying = false;
      } else {
        audio.volume = 0.4;
        audio.play().then(() => {
          soundLabel.innerText = "Mute Ambience";
          soundIcon.innerText = "🔊";
          isPlaying = true;
        }).catch(err => console.warn("Audio waiting for user interaction:", err));
      }
    }

    document.querySelector('a-scene').addEventListener('enter-vr', () => {
      if (!isPlaying) toggleAudio();
    });

    // Multi-Floor Scenes Database with Dynamic Plan Map Assignment
    const scenes = [
      // Ground Floor (Level 0)
      { 
        id: 'img-ground-main', 
        assetId: 'ground-render',
        name: 'Main Market Hall', 
        floorName: 'Ground Floor',
        floorCode: 'G',
        level: 0, 
        src: 'ground_floor.jpg', 
        planImg: 'panorama_1_plan.png',
        planTitle: 'Ground Floor Atrium',
        nextTarget: 'img-floor1-corridor', 
        nextLabel: 'Go up to Level 1 Corridor', 
        nextPos: '0 -1.6 -4' 
      },

      // Level 1
      { 
        id: 'img-floor1-corridor', 
        assetId: 'floor1-render',
        name: 'First Floor Exhibition Corridor', 
        floorName: 'First Floor',
        floorCode: '1',
        level: 1, 
        src: 'firstfloorcorridor_1.jpg', 
        planImg: 'panorama_1_plan.png',
        planTitle: 'Level 1 Corridor',
        nextTarget: 'img-floor2-node1', 
        nextLabel: 'Go up to 2nd Floor Gallery', 
        nextPos: '0 -1.6 -4' 
      },

      // Level 2 - Node 1 (Station 1)
      { 
        id: 'img-floor2-node1', 
        assetId: 'floor2-render-1',
        name: '2nd Floor Gallery - Station 1', 
        floorName: 'Second Floor',
        floorCode: '2',
        level: 2, 
        src: 'panorama_1.jpg', 
        planImg: 'panorama_1_plan.png',
        planTitle: 'Level 2 Corridor: Station 1',
        nextTarget: 'img-floor2-node2', 
        nextLabel: 'Walk down hallway to Station 2', 
        nextPos: '2.5 -1.4 -4' 
      },

      // Level 2 - Node 2 (Station 2)
      { 
        id: 'img-floor2-node2', 
        assetId: 'floor2-render-2',
        name: '2nd Floor Gallery - Station 2', 
        floorName: 'Second Floor',
        floorCode: '2',
        level: 2, 
        src: 'panorama_2.jpg', 
        planImg: 'panorama_2_plan.png',
        planTitle: 'Level 2 Corridor: Station 2',
        nextTarget: 'img-floor2-node1', 
        nextLabel: 'Return back to Station 1', 
        nextPos: '-2.5 -1.4 4' 
      },

      // Level 3
      { 
        id: 'img-floor3', 
        assetId: 'fallback-render',
        name: 'Level 3 Rooftop Overlook', 
        floorName: 'Rooftop Terrace',
        floorCode: '3',
        level: 3, 
        src: 'market.jpg', 
        planImg: 'panorama_2_plan.png',
        planTitle: 'Level 3 Rooftop',
        nextTarget: 'img-floor2-node1', 
        nextLabel: 'Down to Level 2', 
        nextPos: '0 -1.6 4' 
      }
    ];

    let activeSceneId = 'img-floor2-node1';
    let currentFloor = 2;

    window.onload = () => { 
      loadScene('img-floor2-node1');
    };

    function switchFloor(floorNum, btnElement) {
      currentFloor = floorNum;
      
      document.querySelectorAll('.floor-box-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) {
        btnElement.classList.add('active');
      } else {
        const matchingBtn = document.querySelector(`.floor-box-btn[data-floor="${floorNum}"]`);
        if (matchingBtn) matchingBtn.classList.add('active');
      }

      const firstSceneOfFloor = scenes.find(s => s.level === floorNum);
      if (firstSceneOfFloor) {
        loadScene(firstSceneOfFloor.id);
      } else {
        updateFloorUI(floorNum);
      }
    }

    function toggleFloor2Node() {
      if (currentFloor === 2) {
        if (activeSceneId === 'img-floor2-node1') {
          loadScene('img-floor2-node2');
        } else {
          loadScene('img-floor2-node1');
        }
      }
    }

    function updateFloorUI(level) {
      const thumbContainer = document.getElementById('thumb-strip');
      thumbContainer.innerHTML = '';
      const filteredScenes = scenes.filter(s => s.level === level);

      filteredScenes.forEach(scene => {
        const card = document.createElement('div');
        card.className = `thumb-card ${scene.id === activeSceneId ? 'active' : ''}`;
        card.onclick = () => loadScene(scene.id);

        card.innerHTML = `
          <img src="${scene.src}" alt="${scene.name}">
          <span>${scene.name}</span>
        `;
        thumbContainer.appendChild(card);
      });
    }

    function loadScene(sceneId) {
      const sceneData = scenes.find(s => s.id === sceneId);
      if (!sceneData) return;

      activeSceneId = sceneId;

      if (sceneData.level !== currentFloor) {
        currentFloor = sceneData.level;
        document.querySelectorAll('.floor-box-btn').forEach(btn => btn.classList.remove('active'));
        const matchingBtn = document.querySelector(`.floor-box-btn[data-floor="${sceneData.level}"]`);
        if (matchingBtn) matchingBtn.classList.add('active');
      }

      // 1. Switch 360 Sky Sphere
      const sky = document.getElementById('sky-sphere');
      sky.setAttribute('src', `#${sceneData.assetId}`);

      // 2. Update Header
      document.getElementById('location-title').innerText = sceneData.name;
      document.getElementById('location-subtitle').innerText = `${sceneData.floorName} • Architectural 360 Panorama`;

      // 3. Update Floor Plan Blueprint Image and Header Label
      const mapImg = document.getElementById('minimap-img');
      const mapHeader = document.getElementById('map-header');
      mapImg.src = sceneData.planImg;
      mapHeader.innerText = sceneData.planTitle;

      // 4. Update Navigation Hotspot
      const hotspot = document.getElementById('hotspot-navigation');
      if (sceneData.nextTarget) {
        hotspot.setAttribute('visible', 'true');
        hotspot.setAttribute('position', sceneData.nextPos);
        hotspot.setAttribute('onclick', `loadScene('${sceneData.nextTarget}')`);
        hotspot.querySelector('a-text').setAttribute('value', sceneData.nextLabel);
      } else {
        hotspot.setAttribute('visible', 'false');
      }

      updateFloorUI(sceneData.level);
    }
  </script>
</body>
</html>
