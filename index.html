<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market 360 - Virtual Experience</title>
  <!-- A-Frame WebXR Framework -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    /* 1. EMBEDDED APPLE SAN FRANCISCO FONT DEFINITIONS */
    @font-face {
      font-family: 'SF Pro Custom';
      src: url('SF-Pro-Text-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'SF Pro Custom';
      src: url('SF-Pro-Text-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'SF Pro Custom';
      src: url('SF-Pro-Text-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* 2. UNIVERSAL TYPOGRAPHY BINDING */
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'SF Pro Custom', -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", "San Francisco", sans-serif !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    body, html { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #000000;
    }

    /* --- STARTUP LANDING OVERLAY --- */
    #startup-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background-color: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.8s;
    }

    #startup-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Outer Bokeh Frame Layer */
    .bokeh-background {
      position: absolute;
      inset: -40px;
      background: url('market_render.JPG') center/cover no-repeat;
      filter: blur(35px) brightness(0.6) saturate(1.4);
      transform: scale(1.1);
      z-index: 1;
    }

    .bokeh-light {
      position: absolute;
      border-radius: 50%;
      filter: blur(30px);
      opacity: 0.45;
      mix-blend-mode: screen;
      animation: floatBokeh 10s infinite alternate ease-in-out;
      z-index: 2;
    }

    .bokeh-light.orb1 { width: 320px; height: 320px; background: #ffaa55; top: 10%; left: 15%; }
    .bokeh-light.orb2 { width: 400px; height: 400px; background: #4488ff; bottom: 15%; right: 10%; animation-duration: 13s; }
    .bokeh-light.orb3 { width: 250px; height: 250px; background: #ffffff; top: 50%; left: 70%; animation-duration: 8s; }

    @keyframes floatBokeh {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-40px) scale(1.15); }
    }

    /* Overall Market Render Card Container */
    .market-render-wrapper {
      position: relative;
      z-index: 3;
      width: 82vw;
      height: 72vh;
      max-width: 1200px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    .market-render-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      transition: transform 6s ease-out;
    }

    .market-render-wrapper:hover .market-render-image {
      transform: scale(1.06);
    }

    /* Center "Let's Navigate" Curved Rectangle Button */
    .center-cta-btn {
      position: absolute;
      z-index: 10;
      padding: 16px 42px;
      background: rgba(255, 255, 255, 0.18);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      border-radius: 40px;
      color: #ffffff;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.15);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .center-cta-btn:hover {
      background: #ffffff;
      color: #111111;
      transform: scale(1.06);
      box-shadow: 0 15px 40px rgba(255, 255, 255, 0.3);
    }

    /* Bottom Left Corner Logo (50px by 50px) */
    .startup-logo {
      position: absolute;
      bottom: 24px;
      left: 28px;
      z-index: 10;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
    }

    .startup-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Bottom Academic Credits Bar */
    .startup-credits-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 32px;
      padding: 10px 28px;
      background: rgba(18, 18, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 30px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    .credit-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #f5f5f7;
      font-size: 13px;
      white-space: nowrap;
    }

    .credit-label {
      color: rgba(255, 255, 255, 0.55);
      font-weight: 500;
    }

    .credit-value {
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* Top Overlay Header */
    .header-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), transparent);
      color: #ffffff;
      z-index: 100;
      pointer-events: auto;
    }

    .header-title h1 { 
      font-size: 19px; 
      font-weight: 700; 
      letter-spacing: -0.025em; 
    }
    
    .header-title p { 
      font-size: 12px; 
      font-weight: 400;
      color: rgba(255, 255, 255, 0.75); 
      margin-top: 2px; 
      letter-spacing: -0.01em;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .audio-btn, .back-home-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.01em;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .audio-btn:hover, .back-home-btn:hover { 
      background: #ffffff; 
      color: #111111; 
    }

    /* Vertical Floor Elevator (Updated for 8 Levels: Site to Terrace) */
    .floor-elevator-nav {
      position: absolute;
      top: 80px;
      left: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: none;
    }
    .floor-elevator-nav::-webkit-scrollbar { display: none; }

    .floor-box-btn {
      width: 42px;
      height: 38px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1d1d1f;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .floor-box-btn:hover {
      background: #ffffff;
      transform: scale(1.06);
    }

    .floor-box-btn.active {
      background: #0071e3;
      color: #ffffff;
      border-color: #0077ed;
      box-shadow: 0 0 14px rgba(0, 113, 227, 0.65);
    }

    /* Mini-Map In Corner */
    .minimap-container {
      position: absolute;
      bottom: 24px;
      left: 24px;
      width: 380px;
      max-width: 45vw;
      height: 90px;
      background: rgba(28, 28, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      z-index: 100;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .minimap-container:hover {
      transform: scale(1.02);
      border-color: #0071e3;
    }

    .minimap-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #f5f5f7;
      font-size: 10.5px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .minimap-header span.expand-hint {
      color: #0071e3;
      font-size: 9.5px;
      font-weight: 600;
    }

    .minimap-body {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 14px;
    }

    #minimap-img {
      width: 95%;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    /* Enlarged Map Modal */
    #enlarged-map-modal {
      position: fixed;
      inset: 0;
      z-index: 99990;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s;
    }

    #enlarged-map-modal.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .map-modal-bokeh-bg {
      position: absolute;
      inset: -30px;
      background: url('market_render.JPG') center/cover no-repeat;
      filter: blur(40px) brightness(0.4) saturate(1.3);
      z-index: 1;
    }

    .enlarged-map-card {
      position: relative;
      z-index: 2;
      width: 82vw;
      max-width: 1050px;
      background: rgba(22, 22, 26, 0.88);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .enlarged-map-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffffff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 12px;
    }

    .enlarged-map-title h2 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .enlarged-map-title p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);
      margin-top: 2px;
    }

    .close-map-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .close-map-btn:hover {
      background: #ffffff;
      color: #111111;
    }

    .enlarged-blueprint-stage {
      position: relative;
      width: 100%;
      height: 52vh;
      min-height: 320px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #enlarged-blueprint-img {
      width: 96%;
      height: 90%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .map-teleport-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #0071e3;
      border: 2px solid #ffffff;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(0, 113, 227, 0.9), 0 4px 10px rgba(0,0,0,0.5);
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 10;
    }

    .map-teleport-pin:hover {
      background: #ffffff;
      color: #0071e3;
      transform: translate(-50%, -50%) scale(1.22);
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.9);
    }

    .map-teleport-pin.active-node {
      background: #34c759;
      box-shadow: 0 0 20px rgba(52, 199, 89, 0.9);
    }

    .map-teleport-pin span.pin-tooltip {
      position: absolute;
      bottom: 44px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .map-teleport-pin:hover span.pin-tooltip {
      opacity: 1;
    }

    /* Bottom Carousel */
    .bottom-nav-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.4) 70%, transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 90;
      pointer-events: none;
    }

    .bottom-nav-container > * { pointer-events: auto; }

    .thumbnail-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      max-width: 50vw;
      padding-bottom: 6px;
    }

    .thumb-card {
      position: relative;
      flex: 0 0 auto;
      width: 110px;
      height: 65px;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .thumb-card img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }

    .thumb-card span {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: -0.01em;
      padding: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thumb-card.active {
      border-color: #0071e3;
      box-shadow: 0 0 12px rgba(0, 113, 227, 0.8);
    }
  </style>
</head>
<body>

  <!-- ==================== STARTUP LANDING OVERLAY ==================== -->
  <div id="startup-screen">
    <!-- Outer Bokeh Frame Layer -->
    <div class="bokeh-background"></div>
    <div class="bokeh-light orb1"></div>
    <div class="bokeh-light orb2"></div>
    <div class="bokeh-light orb3"></div>

    <!-- Overall Market Render Viewport -->
    <div class="market-render-wrapper">
      <img src="market_render.JPG" alt="Overall Market Render" class="market-render-image" onerror="this.src='ground_floor.jpg'">
      <button class="center-cta-btn" onclick="startNavigationExperience()">Let's Navigate</button>
    </div>

    <!-- Bottom Left Corner Logo (50px by 50px) -->
    <div class="startup-logo">
      <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    </div>

    <!-- Bottom Academic Credits Bar -->
    <div class="startup-credits-bar">
      <div class="credit-item">
        <span class="credit-label">Name:</span>
        <span class="credit-value">Balakrishna Darla</span>
      </div>
      <div class="credit-item">
        <span class="credit-label">Year:</span>
        <span class="credit-value">Vth Year</span>
      </div>
      <div class="credit-item">
        <span class="credit-label">Sem:</span>
        <span class="credit-value">IX</span>
      </div>
      <div class="credit-item">
        <span class="credit-label">Roll no:</span>
        <span class="credit-value">Vu22arch0100016</span>
      </div>
    </div>
  </div>

  <!-- Ambient Audio -->
  <audio id="ambient-audio" loop preload="auto" crossorigin="anonymous">
    <source src="https://upload.wikimedia.org/wikipedia/commons/e/ec/Wind_blowing_at_mountain_pass.ogg" type="audio/ogg">
    <source src="https://actions.google.com/sounds/v1/weather/wind_arctic_constant.ogg" type="audio/ogg">
  </audio>

  <!-- Top Header UI -->
  <div class="header-bar">
    <div class="header-title">
      <h1 id="location-title">Main Market Courtyard</h1>
      <p id="location-subtitle">Site • Architectural 360 Panorama</p>
    </div>
    <div class="header-controls">
      <button class="back-home-btn" onclick="returnToStartup()">
        <span>🏠</span> <span>Home</span>
      </button>
      <button id="sound-btn" class="audio-btn" onclick="toggleAudio()">
        <span id="sound-icon">🔈</span> <span id="sound-label">Enable Ambience</span>
      </button>
    </div>
  </div>

  <!-- Vertical Floor Elevator Switcher: 8 Floors (Top to Bottom) -->
  <div class="floor-elevator-nav">
    <button class="floor-box-btn" data-floor="7" onclick="switchFloor(7, this)" title="Terrace">TR</button>
    <button class="floor-box-btn" data-floor="6" onclick="switchFloor(6, this)" title="Third Floor">3</button>
    <button class="floor-box-btn" data-floor="5" onclick="switchFloor(5, this)" title="Second Floor">2</button>
    <button class="floor-box-btn" data-floor="4" onclick="switchFloor(4, this)" title="First Floor">1</button>
    <button class="floor-box-btn" data-floor="3" onclick="switchFloor(3, this)" title="Ground Floor">G</button>
    <button class="floor-box-btn" data-floor="2" onclick="switchFloor(2, this)" title="Podium-1">P1</button>
    <button class="floor-box-btn" data-floor="1" onclick="switchFloor(1, this)" title="Stilt Floor">ST</button>
    <button class="floor-box-btn active" data-floor="0" onclick="switchFloor(0, this)" title="Site">S</button>
  </div>

  <!-- Mini-Map in Corner (Click to Enlarge) -->
  <div class="minimap-container" onclick="openEnlargedMap()" title="Click to enlarge floor plan and teleport">
    <div class="minimap-header">
      <span id="map-header">Site Layout Plan</span>
      <span class="expand-hint">⤢ ENLARGE</span>
    </div>
    <div class="minimap-body">
      <img id="minimap-img" src="panorama_1_plan.png" alt="Corridor Map Plan">
    </div>
  </div>

  <!-- Enlarged Map Modal with Bokeh and Teleport Points -->
  <div id="enlarged-map-modal" class="hidden">
    <div class="map-modal-bokeh-bg" onclick="closeEnlargedMap()"></div>
    <div class="enlarged-map-card">
      <div class="enlarged-map-header-bar">
        <div class="enlarged-map-title">
          <h2 id="enlarged-modal-title">Interactive Floor Plan</h2>
          <p>Select any numbered station point to teleport directly to that 360 view</p>
        </div>
        <button class="close-map-btn" onclick="closeEnlargedMap()">✕ Close Map</button>
      </div>

      <div class="enlarged-blueprint-stage" id="enlarged-blueprint-stage">
        <img id="enlarged-blueprint-img" src="panorama_1_plan.png" alt="Enlarged Blueprint">
        <div id="pins-container"></div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Carousel -->
  <div class="bottom-nav-container">
    <div class="thumbnail-strip" id="thumb-strip"></div>
  </div>

  <!-- A-Frame VR Canvas -->
  <a-scene id="vr-scene" embedded vr-mode-ui="enabled: true">
    <a-entity id="cameraRig" position="0 0 0">
      <a-camera id="camera" look-controls wasd-controls="enabled: false">
        <a-cursor 
          id="cursor"
          color="#FFFFFF"
          raycaster="objects: .clickable"
          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1">
        </a-cursor>

        <!-- Seamless Black Fade Sphere Attached to Camera -->
        <a-sphere 
          id="fade-sphere" 
          radius="0.1" 
          position="0 0 -0.05"
          material="color: #000000; side: back; shader: flat; transparent: true; opacity: 0"
          visible="false">
        </a-sphere>
      </a-camera>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
    </a-entity>

    <!-- 360 Sky Sphere Background -->
    <a-sky id="sky-sphere" src="ground_floor.jpg" rotation="0 -90 0"></a-sky>

    <!-- Navigation Seeker Hotspot -->
    <a-entity id="hotspot-navigation" class="clickable" position="0 -1.6 -4" rotation="-90 0 0">
      <a-ring radius-inner="0.3" radius-outer="0.45" color="#FFFFFF" opacity="0.85"></a-ring>
      <a-circle radius="0.3" color="#0071E3" opacity="0.65"></a-circle>
      <a-text 
        value="Walk Forward" 
        align="center" 
        position="0 -0.8 0" 
        rotation="90 0 0" 
        scale="1.2 1.2 1.2" 
        color="#FFFFFF" 
        font="dejavu" 
        letter-spacing="-0.5">
      </a-text>
    </a-entity>
  </a-scene>

  <script>
    const audio = document.getElementById('ambient-audio');
    const soundBtn = document.getElementById('sound-btn');
    const soundLabel = document.getElementById('sound-label');
    const soundIcon = document.getElementById('sound-icon');
    let isPlaying = false;
    let isTransitioning = false;
    const buildTimestamp = Date.now();

    // Startup Experience Triggers
    function startNavigationExperience() {
      const startupScreen = document.getElementById('startup-screen');
      startupScreen.classList.add('hidden');
      if (!isPlaying) toggleAudio();
    }

    function returnToStartup() {
      const startupScreen = document.getElementById('startup-screen');
      startupScreen.classList.remove('hidden');
    }

    function toggleAudio() {
      if (isPlaying) {
        audio.pause();
        soundLabel.innerText = "Enable Ambience";
        soundIcon.innerText = "🔈";
        isPlaying = false;
      } else {
        audio.volume = 0.4;
        audio.play().then(() => {
          soundLabel.innerText = "Mute Ambience";
          soundIcon.innerText = "🔊";
          isPlaying = true;
        }).catch(err => console.warn(err));
      }
    }

    document.querySelector('a-scene').addEventListener('enter-vr', () => {
      const startupScreen = document.getElementById('startup-screen');
      if (!startupScreen.classList.contains('hidden')) {
        startupScreen.classList.add('hidden');
      }
      if (!isPlaying) toggleAudio();
    });

    // Scene Database Structured for the 8 New Floors
    const scenes = [
      // 1. Site (Level 0)
      { 
        id: 'img-site-main', 
        name: 'Main Market Courtyard', 
        floorName: 'Site',
        floorCode: 'S',
        level: 0, 
        src: 'ground_floor.jpg',

        floorCode: 'ST',
        level: 1, 
        src: 'ground_floor.jpg', 
        planImg: 'panorama_1_plan.png',

        pinX: 30,

        nextTarget: 'img-podium-main',

      },

      // 3. Podium-1 (Level 2)
      {

      },

      // 4. Ground Floor (Level 3)
      { 
        id: 'img-ground-main',

        floorName: 'Ground Floor',
        floorCode: 'G',
        level: 3, 
        src: 'ground_floor.jpg', 
        planImg: 'panorama_1_plan.png',
        planTitle: 'Ground Floor Plan',

        pinX: 25,

        nextTarget: 'img-firstfloor-corridor', 
        nextLabel: 'Go to First Floor',

      },

      // 5. First Floor (Level 4)
      { 
        id: 'img-firstfloor-corridor', 
        name: 'First Floor Exhibition Corridor', 
        floorName: 'First Floor',
        floorCode: '1',
        level: 4, 
        src: 'firstfloorcorridor_1.jpg', 
        planImg: 'panorama_1_plan.png',

      // 6. Second Floor - Station 1 (Level 5, Pin 1)

      },

      // 6. Second Floor - Station 2 (Level 5, Pin 2)
      {

      {

        nextLabel: 'Down to Second Floor', 
        nextPos: '0 -1.6 4' 
      }
    ];

    let activeSceneId = 'img-site-main';
    let currentFloor = 0;

    window.onload = () => { 
      loadScene('img-site-main', false);
    };

    /* --- ENLARGED MAP MODAL ENGINE --- */
    function openEnlargedMap() {
      const modal = document.getElementById('enlarged-map-modal');
      const enlargedImg = document.getElementById('enlarged-blueprint-img');
      const modalTitle = document.getElementById('enlarged-modal-title');
      const pinsContainer = document.getElementById('pins-container');

      const currentScene = scenes.find(s => s.id === activeSceneId) || scenes[0];
      enlargedImg.src = currentScene.planImg;
      modalTitle.innerText = `${currentScene.floorName} - ${currentScene.planTitle}`;

      // Render Teleport Pins for the active floor
      pinsContainer.innerHTML = '';
      const floorScenes = scenes.filter(s => s.level === currentFloor);

      floorScenes.forEach((scene) => {
        const pin = document.createElement('div');
        pin.className = `map-teleport-pin ${scene.id === activeSceneId ? 'active-node' : ''}`;
        pin.style.left = `${scene.pinX}%`;
        pin.style.top = `${scene.pinY}%`;
        pin.innerHTML = `
          ${scene.pinNum}
          <span class="pin-tooltip">${scene.name}</span>
        `;
        pin.onclick = (e) => {
          e.stopPropagation();
          closeEnlargedMap();
          loadScene(scene.id, true);
        };
        pinsContainer.appendChild(pin);
      });

      modal.classList.remove('hidden');
    }

    function closeEnlargedMap() {
      const modal = document.getElementById('enlarged-map-modal');
      modal.classList.add('hidden');
    }

    // Floor Elevator Switcher
    function switchFloor(floorNum, btnElement) {
      if (isTransitioning) return;
      currentFloor = floorNum;
      
      document.querySelectorAll('.floor-box-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) {
        btnElement.classList.add('active');
      } else {
        const matchingBtn = document.querySelector(`.floor-box-btn[data-floor="${floorNum}"]`);
        if (matchingBtn) matchingBtn.classList.add('active');
      }

      const firstSceneOfFloor = scenes.find(s => s.level === floorNum);
      if (firstSceneOfFloor) {
        loadScene(firstSceneOfFloor.id, true);
      } else {
        updateFloorUI(floorNum);
      }
    }

    function updateFloorUI(level) {
      const thumbContainer = document.getElementById('thumb-strip');
      thumbContainer.innerHTML = '';
      const filteredScenes = scenes.filter(s => s.level === level);

      filteredScenes.forEach(scene => {
        const card = document.createElement('div');
        card.className = `thumb-card ${scene.id === activeSceneId ? 'active' : ''}`;
        card.onclick = () => loadScene(scene.id, true);

        card.innerHTML = `
          <img src="${scene.src}?v=${buildTimestamp}" alt="${scene.name}">
          <span>${scene.name}</span>
        `;
        thumbContainer.appendChild(card);
      });
    }

    // Seamless Transition Engine
    function loadScene(sceneId, animate = true) {
      if (isTransitioning && animate) return;
      const sceneData = scenes.find(s => s.id === sceneId);
      if (!sceneData) return;

      const fadeSphere = document.getElementById('fade-sphere');
      const cameraRig = document.getElementById('cameraRig');
      const hotspot = document.getElementById('hotspot-navigation');

      if (!animate) {
        applySceneData(sceneData);
        return;
      }

      isTransitioning = true;
      fadeSphere.setAttribute('visible', 'true');

      // Forward motion toward hotspot
      const hotspotPos = hotspot.getAttribute('position');
      const moveX = (hotspotPos.x || 0) * 0.35;
      const moveZ = (hotspotPos.z || -4) * 0.35;

      cameraRig.setAttribute('animation', {
        property: 'position',
        to: `${moveX} 0 ${moveZ}`,
        dur: 400,
        easing: 'easeInQuad'
      });

      fadeSphere.setAttribute('animation', {
        property: 'material.opacity',
        from: 0,
        to: 1,
        dur: 400,
        easing: 'easeInQuad'
      });

      // Midpoint: Texture load & reset
      setTimeout(() => {
        applySceneData(sceneData);
        cameraRig.removeAttribute('animation');
        cameraRig.setAttribute('position', '0 0 0');

        fadeSphere.setAttribute('animation', {
          property: 'material.opacity',
          from: 1,
          to: 0,
          dur: 450,
          easing: 'easeOutQuad'
        });

        setTimeout(() => {
          fadeSphere.setAttribute('visible', 'false');
          fadeSphere.removeAttribute('animation');
          isTransitioning = false;
        }, 460);
      }, 410);
    }

    function applySceneData(sceneData) {
      activeSceneId = sceneData.id;

      if (sceneData.level !== currentFloor) {
        currentFloor = sceneData.level;
        document.querySelectorAll('.floor-box-btn').forEach(btn => btn.classList.remove('active'));
        const matchingBtn = document.querySelector(`.floor-box-btn[data-floor="${sceneData.level}"]`);
        if (matchingBtn) matchingBtn.classList.add('active');
      }

      // WebGL texture reload via THREE.TextureLoader
      const sky = document.getElementById('sky-sphere');
      const loader = new THREE.TextureLoader();
      const freshUrl = `${sceneData.src}?v=${buildTimestamp}`;
      
      loader.load(freshUrl, function(texture) {
        const mesh = sky.getObject3D('mesh');
        if (mesh) {
          mesh.material.map = texture;
          mesh.material.needsUpdate = true;
        }
      });

      // Update Header Text
      document.getElementById('location-title').innerText = sceneData.name;
      document.getElementById('location-subtitle').innerText = `${sceneData.floorName} • Architectural 360 Panorama`;

      // Update Mini-Map Blueprint & Header
      const mapImg = document.getElementById('minimap-img');
      const mapHeader = document.getElementById('map-header');
      mapImg.src = sceneData.planImg;
      mapHeader.innerText = sceneData.planTitle;

      // Update Navigation Hotspot
      const hotspot = document.getElementById('hotspot-navigation');
      if (sceneData.nextTarget) {
        hotspot.setAttribute('visible', 'true');
        hotspot.setAttribute('position', sceneData.nextPos);
        hotspot.setAttribute('onclick', `loadScene('${sceneData.nextTarget}', true)`);
        hotspot.querySelector('a-text').setAttribute('value', sceneData.nextLabel);
      } else {
        hotspot.setAttribute('visible', 'false');
      }

      updateFloorUI(sceneData.level);
    }
  </script>
