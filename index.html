<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enscape 360 Virtual Tour</title>
  <!-- A-Frame WebXR Framework -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* Top Overlay Header */
    .header-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), transparent);
      color: #ffffff;
      z-index: 100;
      pointer-events: auto;
    }

    .header-title h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.2px; }
    .header-title p { font-size: 12px; color: rgba(255, 255, 255, 0.75); margin-top: 2px; }

    /* Bottom Overlay Navigation */
    .bottom-nav-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.4) 70%, transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 100;
    }

    /* Floor Buttons */
    .level-selector { display: flex; gap: 8px; }

    .level-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
    }

    .level-btn.active, .level-btn:hover {
      background: #ffffff;
      color: #111111;
      font-weight: 600;
    }

    /* Thumbnail Strip */
    .thumbnail-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      max-width: 90vw;
      padding-bottom: 6px;
    }

    .thumb-card {
      position: relative;
      flex: 0 0 auto;
      width: 110px;
      height: 65px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .thumb-card img { width: 100%; height: 100%; object-fit: cover; }

    .thumb-card span {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      font-size: 10px;
      padding: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thumb-card.active {
      border-color: #4285F4;
      box-shadow: 0 0 10px rgba(66, 133, 244, 0.8);
    }
  </style>
</head>
<body>

  <!-- Google Arts Style Header UI -->
  <div class="header-bar">
    <div class="header-title">
      <h1 id="location-title">Main Lobby</h1>
      <p id="location-subtitle">Floor 1 • Enscape Architectural View</p>
    </div>
  </div>

  <!-- Bottom Control Panel -->
  <div class="bottom-nav-container">
    <div class="level-selector">
      <button class="level-btn active" onclick="filterByLevel(1, this)">Floor 1</button>
      <button class="level-btn" onclick="filterByLevel(2, this)">Floor 2</button>
    </div>

    <div class="thumbnail-strip" id="thumb-strip">
      <!-- Generated automatically -->
    </div>
  </div>

  <!-- VR Canvas -->
  <a-scene embedded vr-mode-ui="enabled: true">
    <a-assets>
      <!-- Preload Panoramas -->
      <img id="pano-lobby" src="assets/floor1_lobby.jpg">
      <img id="pano-gallery" src="assets/floor1_gallery.jpg">
      <img id="pano-ramp" src="assets/floor2_ramp.jpg">
    </a-assets>

    <!-- Camera Controller & Reticle for VR -->
    <a-entity id="cameraRig">
      <a-camera id="camera" look-controls>
        <a-cursor 
          id="cursor"
          color="#FFFFFF"
          raycaster="objects: .clickable"
          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1">
        </a-cursor>
      </a-camera>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
    </a-entity>

    <!-- 360 Sky Sphere -->
    <a-sky id="sky-sphere" src="#pano-lobby" rotation="0 -90 0"></a-sky>

    <!-- Ground Nav Marker -->
    <a-entity id="hotspot-navigation" class="clickable" position="0 -1.8 -4" rotation="-90 0 0">
      <a-ring radius-inner="0.3" radius-outer="0.45" color="#FFFFFF" opacity="0.85"></a-ring>
      <a-circle radius="0.3" color="#4285F4" opacity="0.5"></a-circle>
      <a-text value="Walk to Gallery" align="center" position="0 -0.8 0" rotation="90 0 0" scale="1.2 1.2 1.2" color="#FFFFFF"></a-text>
    </a-entity>
  </a-scene>

  <script>
    // List of Scenes & Navigation Connections
    const scenes = [
      { 
        id: 'pano-lobby', 
        name: 'Main Lobby', 
        level: 1, 
        src: 'assets/floor1_lobby.jpg', 
        thumb: 'assets/floor1_lobby_thumb.jpg', 
        nextTarget: 'pano-gallery', 
        nextLabel: 'Walk to Gallery', 
        nextPos: '0 -1.8 -4' 
      },
      { 
        id: 'pano-gallery', 
        name: 'Exhibition Gallery', 
        level: 1, 
        src: 'assets/floor1_gallery.jpg', 
        thumb: 'assets/floor1_gallery_thumb.jpg', 
        nextTarget: 'pano-ramp', 
        nextLabel: 'Go to Level 2 Ramp', 
        nextPos: '3 -1.8 -3' 
      },
      { 
        id: 'pano-ramp', 
        name: 'Upper Level Ramp', 
        level: 2, 
        src: 'assets/floor2_ramp.jpg', 
        thumb: 'assets/floor2_ramp_thumb.jpg', 
        nextTarget: 'pano-lobby', 
        nextLabel: 'Return to Main Lobby', 
        nextPos: '0 -1.8 4' 
      }
    ];

    let activeSceneId = 'pano-lobby';

    window.onload = () => { renderThumbnails(1); };

    function renderThumbnails(level) {
      const container = document.getElementById('thumb-strip');
      container.innerHTML = '';

      const filteredScenes = scenes.filter(s => s.level === level);

      filteredScenes.forEach(scene => {
        const card = document.createElement('div');
        card.className = `thumb-card ${scene.id === activeSceneId ? 'active' : ''}`;
        card.onclick = () => loadScene(scene.id);

        card.innerHTML = `
          <img src="${scene.thumb}" alt="${scene.name}">
          <span>${scene.name}</span>
        `;
        container.appendChild(card);
      });
    }

    function filterByLevel(level, btnElement) {
      document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      renderThumbnails(level);
    }

    function loadScene(sceneId) {
      const sceneData = scenes.find(s => s.id === sceneId);
      if (!sceneData) return;

      activeSceneId = sceneId;

      const sky = document.getElementById('sky-sphere');
      sky.setAttribute('src', `#${sceneData.id}`);

      document.getElementById('location-title').innerText = sceneData.name;
      document.getElementById('location-subtitle').innerText = `Floor ${sceneData.level} • Enscape Architectural View`;

      const hotspot = document.getElementById('hotspot-navigation');
      if (sceneData.nextTarget) {
        hotspot.setAttribute('visible', 'true');
        hotspot.setAttribute('position', sceneData.nextPos);
        hotspot.setAttribute('onclick', `loadScene('${sceneData.nextTarget}')`);
        hotspot.querySelector('a-text').setAttribute('value', sceneData.nextLabel);
      } else {
        hotspot.setAttribute('visible', 'false');
      }

      renderThumbnails(sceneData.level);
    }
  </script>
</body>
</html>
