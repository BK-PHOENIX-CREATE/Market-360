<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market 360 - Redevelopment of Poorna Market</title>
  <!-- A-Frame WebXR Framework -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    @font-face {
      font-family: 'SF Pro Custom';
      src: url('SF-Pro-Text-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SF Pro Custom';
      src: url('SF-Pro-Text-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SF Pro Custom';
      src: url('SF-Pro-Text-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'SF Pro Custom', -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif !important;
      -webkit-font-smoothing: antialiased;
    }
    
    body, html { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #000000;
      color: #ffffff;
    }

    /* =========================================================
       PAGE 1: STARTUP LANDING OVERLAY
       ========================================================= */
    #startup-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background-color: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s;
    }

    #startup-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .bokeh-background {
      position: absolute;
      inset: -40px;
      background: url('market_render.JPG') center/cover no-repeat;
      filter: blur(35px) brightness(0.6) saturate(1.4);
      transform: scale(1.1);
      z-index: 1;
    }

    .bokeh-light {
      position: absolute;
      border-radius: 50%;
      filter: blur(30px);
      opacity: 0.45;
      mix-blend-mode: screen;
      animation: floatBokeh 10s infinite alternate ease-in-out;
      z-index: 2;
    }
    .bokeh-light.orb1 { width: 320px; height: 320px; background: #ffaa55; top: 10%; left: 15%; }
    .bokeh-light.orb2 { width: 400px; height: 400px; background: #4488ff; bottom: 15%; right: 10%; animation-duration: 13s; }
    .bokeh-light.orb3 { width: 250px; height: 250px; background: #ffffff; top: 50%; left: 70%; animation-duration: 8s; }

    @keyframes floatBokeh {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-40px) scale(1.15); }
    }

    .market-render-wrapper {
      position: relative;
      z-index: 3;
      width: 82vw;
      height: 72vh;
      max-width: 1200px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    .market-render-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      transition: transform 6s ease-out;
    }
    .market-render-wrapper:hover .market-render-image { transform: scale(1.06); }

    .center-cta-btn {
      position: absolute;
      z-index: 10;
      padding: 16px 42px;
      background: rgba(255, 255, 255, 0.18);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      border-radius: 40px;
      color: #ffffff;
      font-size: 19px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .center-cta-btn:hover {
      background: #ffffff;
      color: #111111;
      transform: scale(1.06);
    }

    .startup-logo {
      position: absolute;
      bottom: 24px;
      left: 28px;
      z-index: 10;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
    }
    .startup-logo img { width: 100%; height: 100%; object-fit: contain; }

    .startup-credits-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 32px;
      padding: 10px 28px;
      background: rgba(18, 18, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 30px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    .credit-item { display: flex; align-items: center; gap: 6px; color: #f5f5f7; font-size: 13px; white-space: nowrap; }
    .credit-label { color: rgba(255, 255, 255, 0.55); font-weight: 500; }
    .credit-value { font-weight: 700; }

    /* =========================================================
       PAGE 2: REDEVELOPMENT OF POORNA MARKET DASHBOARD
       ========================================================= */
    #project-details-screen {
      position: fixed;
      inset: 0;
      z-index: 99995;
      background-color: #0b0c10;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 16px;
      transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.5s;
    }

    #project-details-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .dashboard-frame {
      position: relative;
      z-index: 3;
      width: 95vw;
      max-width: 1400px;
      height: 94vh;
      background: rgba(18, 19, 24, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 20px 26px;
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.92);
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
    }

    .header-subtag {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 600;
    }

    .dashboard-nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .dash-nav-item {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
      cursor: pointer;
      position: relative;
      transition: color 0.2s ease;
    }

    .dash-nav-item.active, .dash-nav-item:hover {
      color: #ffffff;
    }

    .dash-nav-item.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #f08a5d;
      border-radius: 2px;
    }

    .dash-exit-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 5px 16px;
      border-radius: 16px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .dash-exit-btn:hover { background: #ffffff; color: #111111; }

    .hero-presentation-card {
      position: relative;
      width: 100%;
      flex: 1.25;
      min-height: 280px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #0d0e12;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 32px;
    }

    .hero-render-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: right center;
      z-index: 1;
      filter: contrast(1.05) saturate(1.08);
      transform: scale(1.005);
      transition: transform 7s ease-out;
    }
    .hero-presentation-card:hover .hero-render-bg {
      transform: scale(1.03);
    }

    .hero-vignette {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to right,
        rgba(13, 14, 18, 0.98) 0%,
        rgba(13, 14, 18, 0.92) 28%,
        rgba(13, 14, 18, 0.55) 42%,
        rgba(13, 14, 18, 0.1) 58%,
        transparent 75%
      ),
      linear-gradient(
        to top,
        rgba(13, 14, 18, 0.85) 0%,
        rgba(13, 14, 18, 0.2) 25%,
        transparent 50%
      );
      z-index: 2;
      pointer-events: none;
    }

    .hero-text-content {
      position: relative;
      z-index: 3;
      max-width: 480px;
    }

    .hero-title-group h1 {
      font-size: 36px;
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #ffffff;
    }

    .hero-title-group h1 span.highlight-orange {
      color: #f08a5d;
    }

    .hero-loc-subtitle {
      font-size: 10.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 8px;
      font-weight: 600;
    }

    .hero-tags {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 3px;
    }

    .hero-description-p {
      font-size: 12px;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 14px;
    }

    .hero-bottom-bar {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }

    .meta-pills-cluster {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .meta-pill-card {
      background: rgba(20, 21, 26, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 8px 14px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill-icon-box {
      font-size: 15px;
      color: #f08a5d;
      opacity: 0.9;
    }

    .pill-text-col {
      display: flex;
      flex-direction: column;
    }

    .pill-header {
      font-size: 8.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 700;
    }

    .pill-val-strong {
      font-size: 11.5px;
      font-weight: 700;
      color: #ffffff;
    }

    .pill-val-sub {
      font-size: 9.5px;
      color: rgba(255, 255, 255, 0.65);
    }

    .watch-video-btn {
      background: rgba(20, 21, 26, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 40px;
      padding: 7px 18px 7px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      backdrop-filter: blur(18px);
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .watch-video-btn .play-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #ffffff;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .watch-video-btn .btn-text-col {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .watch-video-btn .btn-text-col span:first-child {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      color: #ffffff;
    }

    .watch-video-btn .btn-text-col span:last-child {
      font-size: 8px;
      color: rgba(255, 255, 255, 0.55);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .watch-video-btn:hover {
      background: #ffffff;
      border-color: #ffffff;
    }
    .watch-video-btn:hover .play-circle {
      background: #f08a5d;
      border-color: #f08a5d;
      transform: scale(1.08);
    }
    .watch-video-btn:hover .btn-text-col span {
      color: #111111;
    }

    /* Lower Section: 3-Column Architectural Cards */
    .dashboard-lower-grid {
      display: grid;
      grid-template-columns: 1.05fr 1.05fr 0.95fr;
      gap: 14px;
      flex: 0.95;
      min-height: 190px;
    }

    .dash-module-card {
      background: rgba(22, 23, 29, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .card-title-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title-bar h3 {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 700;
    }

    .card-title-bar .title-decor-line {
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Module 1: Context & Intent */
    .context-split-row {
      display: grid;
      grid-template-columns: 1fr 100px;
      gap: 12px;
      align-items: center;
      margin: 8px 0;
    }

    .context-split-row p {
      font-size: 10.5px;
      line-height: 1.48;
      color: rgba(255, 255, 255, 0.78);
    }

    .context-photo-box {
      width: 100%;
      height: 85px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .context-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(80%) contrast(1.1);
    }

    .module-card-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 9.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      transition: all 0.2s ease;
      background: none;
      border: none;
      padding: 0;
    }
    .module-card-action:hover {
      color: #f08a5d;
      transform: translateX(3px);
    }

    /* Module 2: Design Approach Pillars */
    .approach-pillars-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 8px 0;
      text-align: center;
    }

    .approach-pillar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .pillar-visual {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pillar-visual svg {
      width: 22px;
      height: 22px;
    }

    .approach-pillar .pillar-name {
      font-size: 9.5px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .approach-pillar .pillar-desc {
      font-size: 8.5px;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.55);
    }

    /* Module 3: Experience The Market */
    .experience-card-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.7);
      transition: transform 6s ease;
    }
    .dash-module-card:hover .experience-card-bg { transform: scale(1.05); }

    .experience-card-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(12, 13, 18, 0.95) 15%, rgba(12, 13, 18, 0.35) 65%, rgba(12, 13, 18, 0.7) 100%);
      z-index: 2;
    }

    .experience-content-wrap {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .experience-360-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 5px 12px;
      width: fit-content;
      margin: 0 auto;
    }

    .badge-360-icon {
      font-size: 11px;
      font-weight: 700;
      color: #f08a5d;
      border: 1px solid #f08a5d;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .badge-360-text {
      display: flex;
      flex-direction: column;
    }
    .badge-360-text span:first-child {
      font-size: 8.5px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.05em;
    }
    .badge-360-text span:last-child {
      font-size: 7.5px;
      color: rgba(255, 255, 255, 0.6);
    }

    .explore-market-cta-btn {
      width: 100%;
      padding: 10px 16px;
      background: linear-gradient(135deg, #f08a5d, #e77342);
      border: none;
      border-radius: 24px;
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(240, 138, 93, 0.45);
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .explore-market-cta-btn:hover {
      background: linear-gradient(135deg, #ff9b71, #f08a5d);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(240, 138, 93, 0.65);
    }

    /* Modal for Project Video */
    #project-video-modal {
      position: fixed;
      inset: 0;
      z-index: 99998;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(20px);
      transition: opacity 0.3s ease, visibility 0.3s;
    }
    #project-video-modal.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .video-modal-card {
      position: relative;
      width: 80vw;
      max-width: 960px;
      background: #111111;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
    }

    .video-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: #1a1a1f;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .video-modal-header h4 { font-size: 13px; font-weight: 600; }
    .video-close-btn { background: none; border: none; color: #ffffff; font-size: 16px; cursor: pointer; }

    /* =========================================================
       PAGE 3: 360 VR TOUR & UI SYSTEM
       ========================================================= */
    .header-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), transparent);
      color: #ffffff;
      z-index: 100;
      pointer-events: auto;
    }
    .header-title h1 { font-size: 19px; font-weight: 700; }
    .header-title p { font-size: 12px; color: rgba(255, 255, 255, 0.75); margin-top: 2px; }

    .header-controls { display: flex; align-items: center; gap: 10px; }
    .audio-btn, .back-home-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .audio-btn:hover, .back-home-btn:hover { background: #ffffff; color: #111111; }

    /* Persistent Fullscreen Floating Back Button */
    #fullscreen-back-btn {
      position: absolute;
      top: 16px;
      left: 24px;
      z-index: 999999;
      background: rgba(18, 18, 22, 0.92);
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      color: #ffffff;
      padding: 9px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    #fullscreen-back-btn:hover {
      background: #ffffff;
      color: #111111;
      transform: scale(1.05);
    }
    body.is-fullscreen #fullscreen-back-btn {
      display: flex;
    }

    /* Bottom-Right Custom Fullscreen Toggle Button */
    .custom-fullscreen-control {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      width: 44px;
      height: 44px;
      background: rgba(24, 24, 28, 0.88);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 12px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
